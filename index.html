<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Survival VR</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="startScreen">
    <div class="panel">
      <h1>🏝️ ISLAND SURVIVAL VR</h1>
      <p>You wake up on a mysterious island.</p>
      <p class="small">Explore • Gather • Craft • Build • Survive</p>

      <button id="enterVR">ENTER VR</button>

      <div id="status">Checking VR...</div>
    </div>
  </div>

  <div id="hud">
    <div class="stat">
      ❤️ <span id="health">100</span>
    </div>

    <div class="stat">
      🍗 <span id="hunger">100</span>
    </div>

    <div class="stat">
      💧 <span id="thirst">100</span>
    </div>

    <div class="stat">
      🪨 <span id="rockCount">1</span>
    </div>
  </div>

  <div id="message"></div>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { VRButton } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";

    import {
      GAME,
      player,
      movePlayer,
      turnPlayer,
      gatherResource,
      updateSurvival
    } from "./game.js";

    // -------------------------
    // SCENE
    // -------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    // -------------------------
    // CAMERA
    // -------------------------

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.05,
      500
    );

    camera.position.set(0, 1.6, 7);

    // -------------------------
    // PLAYER
    // -------------------------

    const playerGroup = new THREE.Group();

    playerGroup.position.set(
      player.x,
      0,
      player.z
    );

    playerGroup.add(camera);

    scene.add(playerGroup);

    // -------------------------
    // RENDERER
    // -------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.xr.enabled = true;

    renderer.xr.setReferenceSpaceType("local-floor");

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    // -------------------------
    // VR BUTTON
    // -------------------------

    const vrButton = VRButton.createButton(renderer);

    vrButton.style.display = "none";

    document.body.appendChild(vrButton);

    document
      .getElementById("enterVR")
      .addEventListener("click", () => {

        if (navigator.xr) {
          vrButton.click();
        }

      });

    // -------------------------
    // LIGHTING
    // -------------------------

    const sun = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    sun.position.set(
      60,
      100,
      40
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;

    scene.add(sun);

    const sunlight = new THREE.HemisphereLight(
      0xbfe9ff,
      0x31572c,
      1.5
    );

    scene.add(sunlight);

    // -------------------------
    // GROUND
    // -------------------------

    const groundGeometry =
      new THREE.CylinderGeometry(
        28,
        34,
        2,
        64
      );

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x477a3c,
        roughness: 1
      });

    const island =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    island.position.y = -1;

    island.receiveShadow = true;

    scene.add(island);

    // -------------------------
    // BEACH
    // -------------------------

    const beachGeometry =
      new THREE.CylinderGeometry(
        30,
        31,
        0.25,
        64
      );

    const beachMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xd8c58a,
        roughness: 1
      });

    const beach =
      new THREE.Mesh(
        beachGeometry,
        beachMaterial
      );

    beach.position.y = 0.05;

    scene.add(beach);

    // -------------------------
    // LAKE
    // -------------------------

    const lakeGeometry =
      new THREE.CircleGeometry(
        9,
        64
      );

    const lakeMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x2389a8,
        transparent: true,
        opacity: 0.85,
        roughness: 0.15,
        metalness: 0.05
      });

    const lake =
      new THREE.Mesh(
        lakeGeometry,
        lakeMaterial
      );

    lake.rotation.x =
      -Math.PI / 2;

    lake.position.set(
      9,
      0.18,
      -7
    );

    scene.add(lake);

    // -------------------------
    // WATER RINGS
    // -------------------------

    for (let i = 0; i < 5; i++) {

      const ring =
        new THREE.Mesh(
          new THREE.RingGeometry(
            2 + i * 1.3,
            2.05 + i * 1.3,
            64
          ),
          new THREE.MeshBasicMaterial({
            color: 0x7edff2,
            transparent: true,
            opacity: 0.15
          })
        );

      ring.rotation.x =
        -Math.PI / 2;

      ring.position.set(
        9,
        0.21 + i * 0.002,
        -7
      );

      scene.add(ring);
    }

    // -------------------------
    // TREES
    // -------------------------

    function createTree(x, z) {

      const tree =
        new THREE.Group();

      // trunk

      const trunk =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.35,
            0.5,
            4,
            10
          ),
          new THREE.MeshStandardMaterial({
            color: 0x70452a,
            roughness: 1
          })
        );

      trunk.position.y = 2;

      trunk.castShadow = true;

      tree.add(trunk);

      // leaves

      const leaves =
        new THREE.Mesh(
          new THREE.ConeGeometry(
            2.2,
            4.5,
            12
          ),
          new THREE.MeshStandardMaterial({
            color: 0x246b2a,
            roughness: 0.9
          })
        );

      leaves.position.y = 5;

      leaves.castShadow = true;

      tree.add(leaves);

      tree.position.set(
        x,
        0,
        z
      );

      scene.add(tree);

    }

    const trees = [
      [-8,-6],
      [-12,-2],
      [-14,7],
      [-7,12],
      [0,13],
      [8,12],
      [15,5],
      [13,-1],
      [3,-12],
      [-6,-13],
      [-15,-10],
      [17,-9]
    ];

    trees.forEach(t =>
      createTree(t[0], t[1])
    );

    // -------------------------
    // ROCKS
    // -------------------------

    function createRock(x, z, size = 1) {

      const rock =
        new THREE.Mesh(
          new THREE.DodecahedronGeometry(
            size,
            1
          ),
          new THREE.MeshStandardMaterial({
            color: 0x777777,
            roughness: 1
          })
        );

      rock.position.set(
        x,
        size * 0.5,
        z
      );

      rock.scale.y = 0.65;

      rock.castShadow = true;

      rock.userData.resource =
        "rock";

      scene.add(rock);

    }

    createRock(-3, 3, 0.8);
    createRock(-5, 5, 0.6);
    createRock(4, 4, 1);
    createRock(6, 8, 0.7);
    createRock(-11, 3, 0.8);
    createRock(10, 6, 0.9);

    // -------------------------
    // LOG
    // -------------------------

    function createLog(x, z) {

      const log =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.45,
            0.5,
            3,
            12
          ),
          new THREE.MeshStandardMaterial({
            color: 0x80502d,
            roughness: 1
          })
        );

      log.rotation.z =
        Math.PI / 2;

      log.position.set(
        x,
        0.55,
        z
      );

      log.castShadow = true;

      scene.add(log);

    }

    createLog(-2, -2);
    createLog(2, 2);

    // -------------------------
    // STARTING ROCK
    // -------------------------

    const startingRock =
      new THREE.Mesh(
        new THREE.DodecahedronGeometry(
          0.18,
          1
        ),
        new THREE.MeshStandardMaterial({
          color: 0x777777,
          roughness: 1
        })
      );

    startingRock.position.set(
      0.35,
      1.25,
      -0.45
    );

    startingRock.userData.holdable = true;

    camera.add(startingRock);

    // -------------------------
    // VR HANDS / CONTROLLERS
    // -------------------------

    const controller1 =
      renderer.xr.getController(0);

    const controller2 =
      renderer.xr.getController(1);

    scene.add(controller1);
    scene.add(controller2);

    function makeHand(controller) {

      const hand =
        new THREE.Group();

      // palm

      const palm =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            0.11,
            16,
            12
          ),
          new THREE.MeshStandardMaterial({
            color: 0xc58c6b,
            roughness: 0.8
          })
        );

      palm.scale.set(
        1.15,
        0.75,
        1.4
      );

      hand.add(palm);

      // fingers

      for (let i = 0; i < 5; i++) {

        const finger =
          new THREE.Mesh(
            new THREE.CapsuleGeometry(
              0.035,
              0.13,
              4,
              8
            ),
            new THREE.MeshStandardMaterial({
              color: 0xc58c6b,
              roughness: 0.8
            })
          );

        finger.position.set(
          -0.09 + i * 0.045,
          0.01,
          -0.13
        );

        finger.rotation.x =
          Math.PI / 2;

        hand.add(finger);

      }

      controller.add(hand);

    }

    makeHand(controller1);
    makeHand(controller2);

    // -------------------------
    // DESKTOP CONTROLS
    // -------------------------

    const keys = {};

    window.addEventListener(
      "keydown",
      e => {
        keys[e.key.toLowerCase()] = true;
      }
    );

    window.addEventListener(
      "keyup",
      e => {
        keys[e.key.toLowerCase()] = false;
      }
    );

    // -------------------------
    // RESIZE
    // -------------------------

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

    // -------------------------
    // GAME LOOP
    // -------------------------

    let lastTime = performance.now();

    function animate() {

      const now =
        performance.now();

      const delta =
        Math.min(
          (now - lastTime) / 1000,
          0.05
        );

      lastTime = now;

      // Desktop movement

      let forward = 0;
      let sideways = 0;

      if (keys["w"])
        forward += 1;

      if (keys["s"])
        forward -= 1;

      if (keys["a"])
        sideways -= 1;

      if (keys["d"])
        sideways += 1;

      if (forward || sideways) {

        movePlayer(
          forward,
          sideways,
          delta
        );

      }

      if (keys["q"])
        turnPlayer(-1, delta);

      if (keys["e"])
        turnPlayer(1, delta);

      // Update survival

      updateSurvival(delta);

      playerGroup.position.x =
        player.x;

      playerGroup.position.z =
        player.z;

      playerGroup.rotation.y =
        player.rotation;

      // HUD

      document.getElementById(
        "health"
      ).textContent =
        Math.round(GAME.health);

      document.getElementById(
        "hunger"
      ).textContent =
        Math.round(GAME.hunger);

      document.getElementById(
        "thirst"
      ).textContent =
        Math.round(GAME.thirst);

      document.getElementById(
        "rockCount"
      ).textContent =
        GAME.inventory.rock;

      renderer.render(
        scene,
        camera
      );

    }

    renderer.setAnimationLoop(
      animate
    );

    // -------------------------
    // VR CHECK
    // -------------------------

    if (
      navigator.xr &&
      await navigator.xr.isSessionSupported(
        "immersive-vr"
      )
    ) {

      document.getElementById(
        "status"
      ).textContent =
        "Quest VR detected ✓";

    } else {

      document.getElementById(
        "status"
      ).textContent =
        "VR not detected. Desktop mode available.";

    }

  </script>

</body>
</html>
