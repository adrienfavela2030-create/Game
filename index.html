<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#08140f"
  >

  <title>Island Survival VR</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =====================================================
       START SCREEN
  ====================================================== -->

  <div id="startScreen">

    <div class="startPanel">

      <div class="gameLogo">
        ISLAND
        <span>SURVIVAL VR</span>
      </div>

      <p class="startDescription">
        Survive. Explore. Build. Discover.
      </p>

      <button id="startButton">
        ENTER ISLAND
      </button>

      <div id="vrStatus">
        Checking VR support...
      </div>

    </div>

  </div>


  <!-- =====================================================
       HUD
  ====================================================== -->

  <div id="hud">

    <div class="hudStats">

      <div class="stat">
        <span>❤️</span>
        <span id="health">100</span>
      </div>

      <div class="stat">
        <span>🍗</span>
        <span id="hunger">100</span>
      </div>

      <div class="stat">
        <span>💧</span>
        <span id="thirst">100</span>
      </div>

      <div class="stat">
        <span>⚡</span>
        <span id="stamina">100</span>
      </div>

      <div class="stat">
        <span>🪨</span>
        <span id="rockCount">1</span>
      </div>

    </div>

    <div id="worldInfo">
      <span id="dayDisplay">Day 1</span>
      <span id="timeDisplay">08:00</span>
    </div>

  </div>


  <!-- =====================================================
       MESSAGE
  ====================================================== -->

  <div id="message"></div>


  <!-- =====================================================
       THREE.JS
  ====================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <!-- =====================================================
       MAIN GAME MODULE
  ====================================================== -->

  <script type="module">

    import * as THREE from "three";

    import {
      VRButton
    } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


    import {
      GAME,
      player,
      movePlayer,
      turnPlayer,
      updateSurvival
    } from "./game.js";


    import {
      attachHand,
      setupGrip,
      updateHand
    } from "./hands.js";


    /* =====================================================
       CORE
    ====================================================== */

    window.SurvivalVR = {

      THREE,

      GAME,

      player,

      scene: null,

      camera: null,

      renderer: null,

      playerGroup: null,

      controllers: [],

      objects: [],

      resources: [],

      buildings: [],

      heldItems: {
        left: null,
        right: null
      },

      systems: {

        inventory: null,

        crafting: null,

        building: null,

        guide: null,

        world: null,

        home: null,

        settings: null,

        save: null,

        audio: null,

        environment: null,

        animals: null

      },

      ready: false

    };


    /* =====================================================
       SCENE
    ====================================================== */

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(
        0x82c9ee
      );

    scene.fog =
      new THREE.Fog(
        0x82c9ee,
        45,
        120
      );


    window.SurvivalVR.scene =
      scene;


    /* =====================================================
       CAMERA
    ====================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.05,
        250
      );


    camera.position.set(
      0,
      1.65,
      8
    );


    window.SurvivalVR.camera =
      camera;


    /* =====================================================
       PLAYER GROUP
    ====================================================== */

    const playerGroup =
      new THREE.Group();


    playerGroup.position.set(
      0,
      0,
      8
    );


    playerGroup.add(
      camera
    );


    scene.add(
      playerGroup
    );


    window.SurvivalVR.playerGroup =
      playerGroup;


    /* =====================================================
       LIGHTING
    ====================================================== */

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xbfeeff,
        0x26351e,
        1.5
      );


    scene.add(
      hemisphereLight
    );


    const sun =
      new THREE.DirectionalLight(
        0xfff3cf,
        3.2
      );


    sun.position.set(
      -25,
      35,
      20
    );


    sun.castShadow =
      true;


    sun.shadow.mapSize.width =
      2048;

    sun.shadow.mapSize.height =
      2048;


    sun.shadow.camera.left =
      -50;

    sun.shadow.camera.right =
      50;

    sun.shadow.camera.top =
      50;

    sun.shadow.camera.bottom =
      -50;


    scene.add(
      sun
    );


    /* =====================================================
       RENDERER
    ====================================================== */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.xr.enabled =
      true;


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.05;


    document.body.appendChild(
      renderer.domElement
    );


    window.SurvivalVR.renderer =
      renderer;


    /* =====================================================
       VR BUTTON
    ====================================================== */

    const vrButton =
      VRButton.createButton(
        renderer
      );


    vrButton.id =
      "vrButton";


    document.body.appendChild(
      vrButton
    );


    /* =====================================================
       MATERIAL HELPERS
    ====================================================== */

    function material(
      color,
      roughness = 0.8
    ) {

      return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness: 0

      });

    }


    /* =====================================================
       ISLAND
    ====================================================== */

    const islandGeometry =
      new THREE.CylinderGeometry(
        28,
        30,
        2.2,
        64
      );


    const islandMaterial =
      material(
        0x4f873b
      );


    const island =
      new THREE.Mesh(
        islandGeometry,
        islandMaterial
      );


    island.position.y =
      -1.1;


    island.receiveShadow =
      true;


    scene.add(
      island
    );


    /* =====================================================
       BEACH
    ====================================================== */

    const beachGeometry =
      new THREE.CylinderGeometry(
        27.8,
        29,
        0.35,
        64
      );


    const beach =
      new THREE.Mesh(
        beachGeometry,
        material(
          0xd8c486
        )
      );


    beach.position.y =
      0.02;


    beach.receiveShadow =
      true;


    scene.add(
      beach
    );


    /* =====================================================
       GRASS TOP
    ====================================================== */

    const grassGeometry =
      new THREE.CylinderGeometry(
        25.8,
        27.8,
        0.45,
        64
      );


    const grassTop =
      new THREE.Mesh(
        grassGeometry,
        material(
          0x4c8d3c
        )
      );


    grassTop.position.y =
      0.25;


    grassTop.receiveShadow =
      true;


    scene.add(
      grassTop
    );


    /* =====================================================
       LAKE
    ====================================================== */

    const lakeGeometry =
      new THREE.CircleGeometry(
        9,
        64
      );


    const lakeMaterial =
      new THREE.MeshStandardMaterial({

        color: 0x238fc1,

        roughness: 0.12,

        metalness: 0.15,

        transparent: true,

        opacity: 0.82

      });


    const lake =
      new THREE.Mesh(
        lakeGeometry,
        lakeMaterial
      );


    lake.rotation.x =
      -Math.PI / 2;


    lake.position.set(
      9,
      0.48,
      -7
    );


    lake.userData.type =
      "water";


    lake.userData.radius =
      9;


    lake.receiveShadow =
      true;


    scene.add(
      lake
    );


    window.SurvivalVR.objects.push(
      lake
    );


    /* =====================================================
       WATER RINGS
    ====================================================== */

    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const ringGeometry =
        new THREE.RingGeometry(
          1.5 + i * 0.9,
          1.54 + i * 0.9,
          64
        );


      const ringMaterial =
        new THREE.MeshBasicMaterial({

          color: 0x83dfff,

          transparent: true,

          opacity:
            0.16 -
            i * 0.012,

          side:
            THREE.DoubleSide

        });


      const ring =
        new THREE.Mesh(
          ringGeometry,
          ringMaterial
        );


      ring.rotation.x =
        -Math.PI / 2;


      ring.position.set(
        9,
        0.51 + i * 0.002,
        -7
      );


      ring.userData.type =
        "waterWave";


      ring.userData.phase =
        i * 0.7;


      scene.add(
        ring
      );


      window.SurvivalVR.objects.push(
        ring
      );

    }


    /* =====================================================
       TREE CREATOR
    ====================================================== */

    function createTree(
      x,
      z,
      scale = 1
    ) {

      const tree =
        new THREE.Group();


      tree.position.set(
        x,
        0.45,
        z
      );


      tree.scale.setScalar(
        scale
      );


      tree.userData.type =
        "tree";


      tree.userData.resource =
        "wood";


      tree.userData.health =
        5;


      /* Trunk */

      const trunk =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.32,
            0.45,
            4,
            12
          ),
          material(
            0x68401f
          )
        );


      trunk.position.y =
        2;


      trunk.castShadow =
        true;


      trunk.receiveShadow =
        true;


      trunk.userData.type =
        "treeTrunk";


      trunk.userData.parentResource =
        tree;


      tree.add(
        trunk
      );


      /* Main leaves */

      const leafMaterial =
        material(
          0x1e642f
        );


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        const leaves =
          new THREE.Mesh(
            new THREE.SphereGeometry(
              1.5 -
              i * 0.12,
              12,
              10
            ),
            leafMaterial
          );


        leaves.position.set(
          (i % 2 === 0 ? -0.55 : 0.55),
          3.3 +
          i * 0.65,
          i % 2 === 0 ? 0.2 : -0.2
        );


        leaves.scale.y =
          0.8;


        leaves.castShadow =
          true;


        leaves.receiveShadow =
          true;


        leaves.userData.type =
          "treeLeaves";


        leaves.userData.parentResource =
          tree;


        tree.add(
          leaves
        );

      }


      scene.add(
        tree
      );


      window.SurvivalVR.resources.push(
        tree
      );


      return tree;

    }


    /* =====================================================
       TREES
    ====================================================== */

    const treePositions = [

      [-17, -15, 1.15],
      [-12, -7, 0.95],
      [-18, -2, 1.1],
      [-15, 9, 1.05],
      [-7, 16, 1.0],
      [2, 18, 1.15],
      [13, 17, 1.05],
      [19, 10, 0.95],
      [19, 1, 1.1],
      [17, -14, 1.0],
      [3, -19, 1.15],
      [-8, -19, 0.95],
      [-22, 5, 0.9]

    ];


    for (
      const [
        x,
        z,
        scale
      ]
      of treePositions
    ) {

      createTree(
        x,
        z,
        scale
      );

    }


    /* =====================================================
       ROCK CREATOR
    ====================================================== */

    function createRock(
      x,
      z,
      scale = 1
    ) {

      const rock =
        new THREE.Mesh(
          new THREE.DodecahedronGeometry(
            0.75,
            1
          ),
          material(
            0x747a78
          )
        );


      rock.position.set(
        x,
        0.65,
        z
      );


      rock.scale.set(
        scale * 1.2,
        scale * 0.8,
        scale
      );


      rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
      );


      rock.castShadow =
        true;


      rock.receiveShadow =
        true;


      rock.userData.type =
        "rock";


      rock.userData.resource =
        "rock";


      rock.userData.health =
        3;


      scene.add(
        rock
      );


      window.SurvivalVR.resources.push(
        rock
      );


      return rock;

    }


    /* =====================================================
       ROCKS
    ====================================================== */

    const rockPositions = [

      [-13, 13, 1],
      [-4, 14, 0.8],
      [8, 14, 1.1],
      [16, 5, 0.85],
      [-19, -10, 1],
      [-7, -12, 0.9],
      [20, -4, 0.8],
      [4, 21, 0.9]

    ];


    for (
      const [
        x,
        z,
        scale
      ]
      of rockPositions
    ) {

      createRock(
        x,
        z,
        scale
      );

    }


    /* =====================================================
       LOG CREATOR
    ====================================================== */

    function createLog(
      x,
      z,
      rotation = 0
    ) {

      const log =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.35,
            0.42,
            2.5,
            12
          ),
          material(
            0x754821
          )
        );


      log.position.set(
        x,
        0.55,
        z
      );


      log.rotation.z =
        Math.PI / 2;


      log.rotation.y =
        rotation;


      log.castShadow =
        true;


      log.receiveShadow =
        true;


      log.userData.type =
        "log";


      log.userData.item =
        "log";


      scene.add(
        log
      );


      window.SurvivalVR.resources.push(
        log
      );


      return log;

    }


    createLog(
      -3,
      4,
      0.5
    );


    createLog(
      5,
      12,
      1.3
    );


    /* =====================================================
       STARTING ROCK
    ====================================================== */

    const startingRock =
      new THREE.Mesh(
        new THREE.DodecahedronGeometry(
          0.16,
          1
        ),
        material(
          0x737979
        )
      );


    startingRock.position.set(
      0.35,
      -0.15,
      -0.6
    );


    startingRock.userData.type =
      "holdable";


    startingRock.userData.item =
      "rock";


    startingRock.userData.holdable =
      true;


    camera.add(
      startingRock
    );


    /* =====================================================
       VR CONTROLLERS
    ====================================================== */

    const controller1 =
      renderer.xr.getController(
        0
      );


    const controller2 =
      renderer.xr.getController(
        1
      );


    controller1.userData.hand =
      "left";


    controller2.userData.hand =
      "right";


    scene.add(
      controller1
    );


    scene.add(
      controller2
    );


    window.SurvivalVR.controllers =
      [
        controller1,
        controller2
      ];


    /* =====================================================
       HANDS
    ====================================================== */

    attachHand(
      controller1,
      "left"
    );


    attachHand(
      controller2,
      "right"
    );


    setupGrip(
      controller1,
      "left"
    );


    setupGrip(
      controller2,
      "right"
    );


    /* =====================================================
       VR GRAB EVENTS
    ====================================================== */

    controller1.addEventListener(
      "selectstart",
      () => {

        window.dispatchEvent(
          new CustomEvent(
            "survival-grab",
            {
              detail: {
                hand: "left",
                controller:
                  controller1
              }
            }
          )
        );

      }
    );


    controller2.addEventListener(
      "selectstart",
      () => {

        window.dispatchEvent(
          new CustomEvent(
            "survival-grab",
            {
              detail: {
                hand: "right",
                controller:
                  controller2
              }
            }
          )
        );

      }
    );


    controller1.addEventListener(
      "selectend",
      () => {

        window.dispatchEvent(
          new CustomEvent(
            "survival-release",
            {
              detail: {
                hand: "left",
                controller:
                  controller1
              }
            }
          )
        );

      }
    );


    controller2.addEventListener(
      "selectend",
      () => {

        window.dispatchEvent(
          new CustomEvent(
            "survival-release",
            {
              detail: {
                hand: "right",
                controller:
                  controller2
              }
            }
          )
        );

      }
    );


    /* =====================================================
       THUMBSTICK
    ====================================================== */

    function getThumbstick(
      controller
    ) {

      const gamepad =
        controller?.gamepad;


      if (!gamepad) {

        return {
          x: 0,
          y: 0
        };

      }


      const axes =
        gamepad.axes || [];


      if (
        axes.length >= 4
      ) {

        return {
          x: axes[2] || 0,
          y: axes[3] || 0
        };

      }


      return {
        x: axes[0] || 0,
        y: axes[1] || 0
      };

    }


    /* =====================================================
       DESKTOP CONTROLS
    ====================================================== */

    const keys =
      {};


    window.addEventListener(
      "keydown",
      event => {

        keys[
          event.key.toLowerCase()
        ] = true;

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        keys[
          event.key.toLowerCase()
        ] = false;

      }
    );


    /* =====================================================
       MOVEMENT
    ====================================================== */

    function updateMovement(
      delta
    ) {

      let forward = 0;

      let sideways = 0;


      if (
        keys.w
      ) forward += 1;

      if (
        keys.s
      ) forward -= 1;

      if (
        keys.a
      ) sideways -= 1;

      if (
        keys.d
      ) sideways += 1;


      const leftStick =
        getThumbstick(
          controller1
        );


      if (
        Math.abs(leftStick.x) >
        0.15
      ) {

        sideways +=
          leftStick.x;

      }


      if (
        Math.abs(leftStick.y) >
        0.15
      ) {

        forward -=
          leftStick.y;

      }


      const length =
        Math.sqrt(
          forward * forward +
          sideways * sideways
        );


      if (
        length > 1
      ) {

        forward /=
          length;

        sideways /=
          length;

      }


      const speed =
        keys.shift
          ? 4.5
          : 2.5;


      movePlayer(
        sideways *
        speed *
        delta,

        forward *
        speed *
        delta
      );


      let turn =
        0;


      if (
        keys.q
      ) turn -= 1;

      if (
        keys.e
      ) turn += 1;


      const rightStick =
        getThumbstick(
          controller2
        );


      if (
        Math.abs(rightStick.x) >
        0.18
      ) {

        turn +=
          rightStick.x;

      }


      if (
        Math.abs(turn) >
        0.01
      ) {

        turnPlayer(
          turn *
          1.7 *
          delta
        );

      }

    }


    /* =====================================================
       KEEP PLAYER ON ISLAND
    ====================================================== */

    function keepPlayerOnIsland() {

      if (
        !playerGroup
      ) {

        return;

      }


      const x =
        playerGroup.position.x;


      const z =
        playerGroup.position.z;


      const distance =
        Math.sqrt(
          x * x +
          z * z
        );


      const maxDistance =
        26;


      if (
        distance >
        maxDistance
      ) {

        const scale =
          maxDistance /
          distance;


        playerGroup.position.x *=
          scale;


        playerGroup.position.z *=
          scale;

      }

    }


    /* =====================================================
       UPDATE HUD
    ====================================================== */

    function updateHUD() {

      const health =
        document.getElementById(
          "health"
        );


      const hunger =
        document.getElementById(
          "hunger"
        );


      const thirst =
        document.getElementById(
          "thirst"
        );


      const stamina =
        document.getElementById(
          "stamina"
        );


      const rockCount =
        document.getElementById(
          "rockCount"
        );


      if (health) {

        health.textContent =
          Math.round(
            GAME.health ?? 100
          );

      }


      if (hunger) {

        hunger.textContent =
          Math.round(
            GAME.hunger ?? 100
          );

      }


      if (thirst) {

        thirst.textContent =
          Math.round(
            GAME.thirst ?? 100
          );

      }


      if (stamina) {

        stamina.textContent =
          Math.round(
            GAME.stamina ?? 100
          );

      }


      if (rockCount) {

        rockCount.textContent =
          GAME.inventory?.rock ??
          GAME.resources?.rock ??
          1;

      }

    }


    /* =====================================================
       TIME HUD
    ====================================================== */

    function updateTimeHUD() {

      const world =
        window.SurvivalVR.systems.world;


      if (
        !world
      ) {

        return;

      }


      const time =
        world.getTime();


      const day =
        world.getDay();


      const hour =
        Math.floor(
          time
        );


      const minute =
        Math.floor(
          (time - hour) * 60
        );


      const timeElement =
        document.getElementById(
          "timeDisplay"
        );


      const dayElement =
        document.getElementById(
          "dayDisplay"
        );


      if (
        timeElement
      ) {

        timeElement.textContent =
          String(hour).padStart(
            2,
            "0"
          ) +
          ":" +
          String(minute).padStart(
            2,
            "0"
          );

      }


      if (
        dayElement
      ) {

        dayElement.textContent =
          `Day ${day}`;

      }

    }


    /* =====================================================
       START GAME
    ====================================================== */

    const startButton =
      document.getElementById(
        "startButton"
      );


    const startScreen =
      document.getElementById(
        "startScreen"
      );


    let started =
      false;


    function startGame() {

      if (
        started
      ) {

        return;

      }


      started =
        true;


      startScreen?.classList.add(
        "hidden"
      );


      renderer.setAnimationLoop(
        animate
      );

    }


    startButton?.addEventListener(
      "click",
      startGame
    );


    /* =====================================================
       VR SUPPORT
    ====================================================== */

    async function checkVR() {

      const status =
        document.getElementById(
          "vrStatus"
        );


      if (
        !navigator.xr
      ) {

        if (status) {

          status.textContent =
            "WebXR unavailable — desktop/mobile mode available.";

        }

        return;

      }


      try {

        const supported =
          await navigator.xr.isSessionSupported(
            "immersive-vr"
          );


        if (status) {

          status.textContent =
            supported
              ? "VR Ready"
              : "VR not available on this device.";

        }

      } catch (
        error
      ) {

        console.warn(
          "WebXR check failed:",
          error
        );


        if (status) {

          status.textContent =
            "VR support could not be checked.";

        }

      }

    }


    checkVR();


    /* =====================================================
       WINDOW RESIZE
    ====================================================== */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /* =====================================================
       WATER ANIMATION
    ====================================================== */

    function animateWater(
      elapsed
    ) {

      const objects =
        window.SurvivalVR.objects;


      for (
        const object
        of objects
      ) {

        if (
          object?.userData?.type !==
          "waterWave"
        ) {

          continue;

        }


        const phase =
          object.userData.phase ||
          0;


        const pulse =
          1 +
          Math.sin(
            elapsed * 0.8 +
            phase
          ) *
          0.025;


        object.scale.set(
          pulse,
          pulse,
          pulse
        );


        object.material.opacity =
          0.10 +
          (
            Math.sin(
              elapsed * 0.7 +
              phase
            ) + 1
          ) *
          0.035;

      }

    }


    /* =====================================================
       LOAD ALL GAME SYSTEMS
       
       IMPORTANT:
       These are dynamic imports because
       window.SurvivalVR must exist BEFORE
       the systems register themselves.
    ====================================================== */

    async function loadSystems() {

      try {

        await import(
          "./inventory.js"
        );

        await import(
          "./crafting.js"
        );

        await import(
          "./building.js"
        );

        await import(
          "./guide.js"
        );

        await import(
          "./world.js"
        );


        /*
        Future systems will be loaded
        here in the same way:

        await import("./home.js");
        await import("./settings.js");
        await import("./save.js");
        await import("./audio.js");
        await import("./environment.js");
        await import("./animals.js");
        */


        window.SurvivalVR.ready =
          true;


        window.dispatchEvent(
          new Event(
            "survival-core-ready"
          )
        );


        console.log(
          "✅ All current survival systems connected."
        );


      } catch (
        error
      ) {

        console.error(
          "❌ Failed to load survival system:",
          error
        );

        showStartupError(
          error
        );

      }

    }


    /* =====================================================
       STARTUP ERROR
    ====================================================== */

    function showStartupError(
      error
    ) {

      const status =
        document.getElementById(
          "vrStatus"
        );


      if (status) {

        status.textContent =
          "Game system error. Check the browser console.";

      }


      console.error(
        error
      );

    }


    /* =====================================================
       MAIN LOOP
    ====================================================== */

    let lastTime =
      performance.now();


    function animate() {

      const now =
        performance.now();


      let delta =
        (now - lastTime) /
        1000;


      lastTime =
        now;


      /*
      Prevent huge jumps after
      the browser pauses.
      */

      delta =
        Math.min(
          delta,
          0.05
        );


      /* Movement */

      updateMovement(
        delta
      );


      /* Island boundary */

      keepPlayerOnIsland();


      /* Survival */

      updateSurvival(
        delta
      );


      /* World system */

      const world =
        window.SurvivalVR.systems.world;


      if (
        world
      ) {

        world.update(
          delta
        );

      }


      /* Hands */

      updateHand(
        controller1,
        delta
      );


      updateHand(
        controller2,
        delta
      );


      /* Water */

      animateWater(
        now / 1000
      );


      /* HUD */

      updateHUD();


      updateTimeHUD();


      /* Render */

      renderer.render(
        scene,
        camera
      );

    }


    /* =====================================================
       LOAD SYSTEMS
    ====================================================== */

    loadSystems();


    /* =====================================================
       READY
    ====================================================== */

    console.log(
      "🏝️ Island Survival VR core loaded."
    );

  </script>

</body>
</html>
