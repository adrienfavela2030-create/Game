<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#07130d"
  >

  <title>Survival Island VR</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <!-- =====================================================
       THREE.JS IMPORT MAP
  ====================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- =====================================================
       LOADING SCREEN
  ====================================================== -->

  <div id="loading-screen">

    <div class="loading-content">

      <div class="loading-title">
        SURVIVAL ISLAND VR
      </div>

      <div class="loading-subtitle">
        Loading survival systems...
      </div>

      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
        ></div>
      </div>

      <div
        id="loading-status"
        class="loading-status"
      >
        Starting...
      </div>

    </div>

  </div>


  <!-- =====================================================
       BASIC HTML HUD
       The VR HUD is created by vrhud.js.
  ====================================================== -->

  <div
    id="game-hud"
    class="game-hud hidden"
  >

    <div class="hud-top">

      <div class="hud-stat">
        <span>HEALTH</span>
        <strong id="hud-health">100</strong>
      </div>

      <div class="hud-stat">
        <span>HUNGER</span>
        <strong id="hud-hunger">100</strong>
      </div>

      <div class="hud-stat">
        <span>THIRST</span>
        <strong id="hud-thirst">100</strong>
      </div>

      <div class="hud-stat">
        <span>STAMINA</span>
        <strong id="hud-stamina">100</strong>
      </div>

    </div>

  </div>


  <!-- =====================================================
       MESSAGE AREA
  ====================================================== -->

  <div
    id="game-message"
    class="game-message"
  ></div>


  <!-- =====================================================
       DESKTOP / MOBILE START BUTTON
  ====================================================== -->

  <button
    id="start-game-button"
    class="hidden"
    type="button"
  >
    START SURVIVAL
  </button>


  <!-- =====================================================
       THREE.JS + GAME
  ====================================================== -->

  <script type="module">

    /* =====================================================
       THREE
    ====================================================== */

    import * as THREE from "three";

    import {
      VRButton
    } from "three/addons/webxr/VRButton.js";


    /* =====================================================
       GLOBAL SURVIVALVR OBJECT
    ====================================================== */

    const SurvivalVR = {

      THREE,

      scene: null,

      camera: null,

      renderer: null,

      playerRig: null,

      clock:
        new THREE.Clock(),

      GAME: null,

      player: null,

      systems: {},

      worldData: null,

      worldResources: [],

      resources: [],

      buildings: [],

      hands: null,

      isXR: false,

      started: false,

      lastFrameTime: 0,

      ui: {}

    };


    /*
     * Make it globally available BEFORE
     * loading any of the other modules.
     */
    window.SurvivalVR =
      SurvivalVR;


    /* =====================================================
       LOADING UI
    ====================================================== */

    const loadingScreen =
      document.getElementById(
        "loading-screen"
      );

    const loadingProgress =
      document.getElementById(
        "loading-progress"
      );

    const loadingStatus =
      document.getElementById(
        "loading-status"
      );


    function setLoading(
      percent,
      text
    ) {

      if (
        loadingProgress
      ) {
        loadingProgress.style.width =
          `${Math.max(
            0,
            Math.min(
              100,
              percent
            )
          )}%`;
      }

      if (
        loadingStatus
      ) {
        loadingStatus.textContent =
          text;
      }

    }


    /* =====================================================
       SCENE
    ====================================================== */

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(
        0x8fc9df
      );


    /* =====================================================
       PLAYER RIG
    ====================================================== */

    const playerRig =
      new THREE.Group();

    playerRig.name =
      "PlayerRig";

    scene.add(
      playerRig
    );


    /* =====================================================
       CAMERA
    ====================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
          window.innerHeight,
        0.05,
        1000
      );

    camera.position.set(
      0,
      1.65,
      0
    );

    camera.name =
      "PlayerCamera";

    playerRig.add(
      camera
    );


    /* =====================================================
       RENDERER
    ====================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: false,

        powerPreference:
          "high-performance"

      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio ||
          1,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.xr.enabled =
      true;


    /*
     * Quest-friendly reference space.
     */
    renderer.xr.setReferenceSpaceType(
      "local-floor"
    );


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    renderer.domElement.id =
      "game-canvas";


    document.body.appendChild(
      renderer.domElement
    );


    /* =====================================================
       VR BUTTON
    ====================================================== */

    const vrButton =
      VRButton.createButton(
        renderer,
        {
          optionalFeatures: [
            "local-floor",
            "bounded-floor",
            "hand-tracking"
          ]
        }
      );


    vrButton.id =
      "vr-button";


    document.body.appendChild(
      vrButton
    );


    /* =====================================================
       CONNECT GLOBAL OBJECTS
    ====================================================== */

    SurvivalVR.scene =
      scene;

    SurvivalVR.camera =
      camera;

    SurvivalVR.renderer =
      renderer;

    SurvivalVR.playerRig =
      playerRig;


    /* =====================================================
       RESIZE
    ====================================================== */

    function resize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }


    window.addEventListener(
      "resize",
      resize
    );


    /* =====================================================
       DYNAMIC MODULE LOADING
    ====================================================== */

    let GAME;
    let hands;
    let inventory;
    let crafting;
    let building;
    let guide;
    let world;
    let home;
    let settings;
    let save;
    let audio;
    let environment;
    let animals;
    let vrhud;


    async function loadSystems() {

      setLoading(
        5,
        "Loading game core..."
      );

      /*
       * GAME FIRST
       */
      GAME =
        await import(
          "./game.js"
        );

      SurvivalVR.GAME =
        GAME.GAME;

      SurvivalVR.player =
        GAME.player;


      setLoading(
        12,
        "Loading VR hands..."
      );

      hands =
        await import(
          "./hands.js"
        );

      SurvivalVR.systems.hands =
        hands;


      setLoading(
        19,
        "Loading inventory..."
      );

      inventory =
        await import(
          "./inventory.js"
        );

      SurvivalVR.systems.inventory =
        inventory;


      setLoading(
        26,
        "Loading crafting..."
      );

      crafting =
        await import(
          "./crafting.js"
        );

      SurvivalVR.systems.crafting =
        crafting;


      setLoading(
        33,
        "Loading building..."
      );

      building =
        await import(
          "./building.js"
        );

      SurvivalVR.systems.building =
        building;


      setLoading(
        40,
        "Loading survival guide..."
      );

      guide =
        await import(
          "./guide.js"
        );

      SurvivalVR.systems.guide =
        guide;


      setLoading(
        48,
        "Generating world system..."
      );

      world =
        await import(
          "./world.js"
        );

      SurvivalVR.systems.world =
        world;


      setLoading(
        55,
        "Loading home menu..."
      );

      home =
        await import(
          "./home.js"
        );

      SurvivalVR.systems.home =
        home;


      setLoading(
        62,
        "Loading settings..."
      );

      settings =
        await import(
          "./settings.js"
        );

      SurvivalVR.systems.settings =
        settings;


      setLoading(
        69,
        "Loading save system..."
      );

      save =
        await import(
          "./save.js"
        );

      SurvivalVR.systems.save =
        save;


      setLoading(
        76,
        "Loading audio..."
      );

      audio =
        await import(
          "./audio.js"
        );

      SurvivalVR.systems.audio =
        audio;


      setLoading(
        82,
        "Loading environment..."
      );

      environment =
        await import(
          "./environment.js"
        );

      SurvivalVR.systems.environment =
        environment;


      setLoading(
        88,
        "Loading animals..."
      );

      animals =
        await import(
          "./animals.js"
        );

      SurvivalVR.systems.animals =
        animals;


      setLoading(
        94,
        "Loading VR HUD..."
      );

      vrhud =
        await import(
          "./vrhud.js"
        );

      SurvivalVR.systems.vrhud =
        vrhud;


      setLoading(
        100,
        "Ready."
      );

    }


    /* =====================================================
       SYSTEM SETUP
    ====================================================== */

    async function setupSystems() {

      /*
       * World.
       */
      if (
        typeof world.setupWorld ===
        "function"
      ) {
        world.setupWorld();
      }


      /*
       * Hands.
       */
      if (
        typeof hands.setupHands ===
        "function"
      ) {
        hands.setupHands(
          renderer,
          camera,
          playerRig
        );
      }


      /*
       * Inventory.
       */
      if (
        typeof inventory.setupInventory ===
        "function"
      ) {
        inventory.setupInventory();
      }


      /*
       * Crafting.
       */
      if (
        typeof crafting.setupCrafting ===
        "function"
      ) {
        crafting.setupCrafting();
      }


      /*
       * Building.
       */
      if (
        typeof building.setupBuilding ===
        "function"
      ) {
        building.setupBuilding();
      }


      /*
       * Guide.
       */
      if (
        typeof guide.setupGuide ===
        "function"
      ) {
        guide.setupGuide();
      }


      /*
       * Settings.
       */
      if (
        typeof settings.setupSettings ===
        "function"
      ) {
        settings.setupSettings();
      }


      /*
       * Save.
       */
      if (
        typeof save.setupSave ===
        "function"
      ) {
        save.setupSave();
      }


      /*
       * Audio.
       */
      if (
        typeof audio.setupAudio ===
        "function"
      ) {
        audio.setupAudio();
      }


      /*
       * Environment.
       */
      if (
        typeof environment.setupEnvironment ===
        "function"
      ) {
        environment.setupEnvironment();
      }


      /*
       * Animals.
       */
      if (
        typeof animals.setupAnimals ===
        "function"
      ) {
        animals.setupAnimals();
      }


      /*
       * VR HUD.
       */
      if (
        typeof vrhud.setupVRHUD ===
        "function"
      ) {
        vrhud.setupVRHUD();
      }


      /*
       * Home menu LAST.
       *
       * This is important because the
       * launch menu should be the final
       * thing shown after systems load.
       */
      if (
        typeof home.setupHome ===
        "function"
      ) {
        home.setupHome();
      }

    }


    /* =====================================================
       START GAME
    ====================================================== */

    async function startGame(
      seed
    ) {

      try {

        /*
         * If a seed was supplied,
         * use it.
         */
        const existingSeed =
          seed ||
          SurvivalVR.GAME?.world?.seed ||
          undefined;


        /*
         * Generate the island.
         */
        if (
          world &&
          typeof world.generateWorld ===
            "function"
        ) {

          world.generateWorld(
            existingSeed,
            {
              preservePlayer:
                !!existingSeed
            }
          );

        }


        /*
         * Start environment.
         */
        if (
          environment &&
          typeof environment.startEnvironment ===
            "function"
        ) {
          environment.startEnvironment();
        }


        /*
         * Start audio.
         */
        if (
          audio &&
          typeof audio.startAudio ===
            "function"
        ) {
          audio.startAudio();
        }


        /*
         * Start animals.
         */
        if (
          animals &&
          typeof animals.startAnimals ===
            "function"
        ) {
          animals.startAnimals();
        }


        /*
         * Game state.
         */
        if (
          SurvivalVR.GAME?.state
        ) {

          SurvivalVR.GAME.state.started =
            true;

          SurvivalVR.GAME.state.paused =
            false;

          SurvivalVR.GAME.state.gameOver =
            false;

        }


        SurvivalVR.started =
          true;


        if (
          typeof GAME.setPaused ===
          "function"
        ) {
          GAME.setPaused(
            false
          );
        }


        /*
         * HUD.
         */
        const hud =
          document.getElementById(
            "game-hud"
          );

        if (hud) {
          hud.classList.remove(
            "hidden"
          );
        }


        /*
         * Tell home menu.
         */
        window.dispatchEvent(
          new CustomEvent(
            "survival-game-started"
          )
        );

      } catch (error) {

        console.error(
          "START GAME ERROR:",
          error
        );

        showMessage(
          "Game failed to start. Check the browser console."
        );

      }

    }


    /*
     * Make startGame available to
     * home.js.
     */
    SurvivalVR.startGame =
      startGame;


    /* =====================================================
       GAME MESSAGE
    ====================================================== */

    function showMessage(
      message,
      duration = 3000
    ) {

      const element =
        document.getElementById(
          "game-message"
        );

      if (!element) {
        return;
      }

      element.textContent =
        message;

      element.classList.add(
        "show"
      );

      clearTimeout(
        element._timer
      );

      element._timer =
        setTimeout(
          () => {
            element.classList.remove(
              "show"
            );
          },
          duration
        );

    }


    SurvivalVR.showMessage =
      showMessage;


    /* =====================================================
       VR SESSION EVENTS
    ====================================================== */

    renderer.xr.addEventListener(
      "sessionstart",
      () => {

        SurvivalVR.isXR =
          true;

        if (
          typeof GAME.setVRState ===
          "function"
        ) {
          GAME.setVRState(
            true
          );
        }

        /*
         * VR takes control of the
         * camera transform.
         */
        camera.position.set(
          0,
          0,
          0
        );

        window.dispatchEvent(
          new CustomEvent(
            "survival-vr-started"
          )
        );

      }
    );


    renderer.xr.addEventListener(
      "sessionend",
      () => {

        SurvivalVR.isXR =
          false;

        if (
          typeof GAME.setVRState ===
          "function"
        ) {
          GAME.setVRState(
            false
          );
        }

        window.dispatchEvent(
          new CustomEvent(
            "survival-vr-ended"
          )
        );

      }
    );


    /* =====================================================
       HUD UPDATE
    ====================================================== */

    function updateBasicHUD() {

      const player =
        SurvivalVR.GAME?.player;

      if (!player) {
        return;
      }


      const health =
        document.getElementById(
          "hud-health"
        );

      const hunger =
        document.getElementById(
          "hud-hunger"
        );

      const thirst =
        document.getElementById(
          "hud-thirst"
        );

      const stamina =
        document.getElementById(
          "hud-stamina"
        );


      if (health) {
        health.textContent =
          Math.round(
            player.health ?? 100
          );
      }

      if (hunger) {
        hunger.textContent =
          Math.round(
            player.hunger ?? 100
          );
      }

      if (thirst) {
        thirst.textContent =
          Math.round(
            player.thirst ?? 100
          );
      }

      if (stamina) {
        stamina.textContent =
          Math.round(
            player.stamina ?? 100
          );
      }

    }


    /* =====================================================
       MAIN GAME LOOP
    ====================================================== */

    function gameLoop(
      time,
      xrFrame
    ) {

      /*
       * Keep delta stable.
       */
      let delta =
        SurvivalVR.clock.getDelta();

      if (
        !Number.isFinite(
          delta
        )
      ) {
        delta =
          0.016;
      }

      delta =
        Math.min(
          delta,
          0.05
        );


      /*
       * Game is allowed to update
       * even before gameplay starts,
       * but only systems that need
       * gameplay should act.
       */
      if (
        SurvivalVR.GAME?.state?.started
      ) {

        /*
         * Survival.
         */
        if (
          typeof GAME.updateSurvival ===
          "function"
        ) {
          GAME.updateSurvival(
            delta
          );
        }


        /*
         * Hands / movement.
         */
        if (
          hands
        ) {

          if (
            typeof hands.updateHands ===
            "function"
          ) {

            hands.updateHands(
              delta,
              xrFrame
            );

          } else if (
            typeof hands.update ===
            "function"
          ) {

            hands.update(
              delta,
              xrFrame
            );

          }

        }


        /*
         * World.
         */
        if (
          world &&
          typeof world.update ===
            "function"
        ) {
          world.update(
            delta
          );
        }


        /*
         * Environment.
         */
        if (
          environment &&
          typeof environment.update ===
            "function"
        ) {
          environment.update(
            delta
          );
        }


        /*
         * Animals.
         */
        if (
          animals &&
          typeof animals.update ===
            "function"
        ) {
          animals.update(
            delta
          );
        }


        /*
         * Building.
         */
        if (
          building &&
          typeof building.update ===
            "function"
        ) {
          building.update(
            delta
          );
        }


        /*
         * VR HUD.
         */
        if (
          vrhud &&
          typeof vrhud.update ===
            "function"
        ) {
          vrhud.update(
            delta
          );
        }


        updateBasicHUD();

      }


      /*
       * Render.
       */
      renderer.render(
        scene,
        camera
      );

    }


    /* =====================================================
       BOOT
    ====================================================== */

    async function boot() {

      try {

        setLoading(
          0,
          "Starting Survival Island VR..."
        );


        await loadSystems();


        setLoading(
          97,
          "Connecting systems..."
        );


        await setupSystems();


        setLoading(
          100,
          "Ready."
        );


        /*
         * Give the loading screen a
         * tiny moment to finish.
         */
        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              350
            )
        );


        /*
         * Hide loading screen.
         */
        if (
          loadingScreen
        ) {
          loadingScreen.classList.add(
            "hidden"
          );
        }


        /*
         * Begin rendering.
         *
         * IMPORTANT:
         * This does NOT start the game.
         *
         * The home menu decides when
         * gameplay begins.
         */
        renderer.setAnimationLoop(
          gameLoop
        );


        console.log(
          "===================================="
        );

        console.log(
          "SURVIVAL ISLAND VR READY"
        );

        console.log(
          "Three.js:",
          THREE.REVISION
        );

        console.log(
          "VR enabled:",
          renderer.xr.enabled
        );

        console.log(
          "Systems:",
          SurvivalVR.systems
        );

        console.log(
          "===================================="
        );

      } catch (error) {

        console.error(
          "BOOT ERROR:",
          error
        );


        setLoading(
          100,
          "Startup error. Check console."
        );


        showMessage(
          "The game could not finish loading.",
          10000
        );

      }

    }


    /* =====================================================
       START
    ====================================================== */

    boot();

  </script>

</body>
</html>
