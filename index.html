<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VR Convenience Store</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- START SCREEN -->

  <div id="startScreen">

    <div class="panel">

      <h1>🏪 VR Convenience Store</h1>

      <p>
        Welcome to your store!
        <br><br>
        🕹️ Left joystick — Move
        <br>
        🕹️ Right joystick — Turn
        <br>
        👀 Move your head — Look around
      </p>

      <button id="enterVR">
        ENTER VR
      </button>

      <div id="status">
        Checking VR support...
      </div>

    </div>

  </div>


  <!-- DESKTOP CONTROLS -->

  <div id="desktopControls">
    <strong>PC Test:</strong>
    W A S D = Move
    &nbsp; Q / E = Turn
  </div>


  <!-- GAME -->

  <script type="module">

    // ========================================================
    // THREE.JS
    // ========================================================

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    import { VRButton } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";


    // ========================================================
    // OUR GAME.JS
    // ========================================================

    import {

      GAME,
      player,
      movePlayer,
      turnPlayer

    } from "./game.js";


    // ========================================================
    // SCENE
    // ========================================================

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x171c1a
      );


    scene.fog =
      new THREE.Fog(
        0x171c1a,
        12,
        45
      );


    // ========================================================
    // CAMERA
    // ========================================================

    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.05,
        100
      );


    camera.position.set(
      0,
      GAME.playerHeight,
      0
    );


    // ========================================================
    // PLAYER
    // ========================================================

    const playerGroup =
      new THREE.Group();


    playerGroup.position.set(
      player.position.x,
      player.position.y,
      player.position.z
    );


    playerGroup.add(
      camera
    );


    scene.add(
      playerGroup
    );


    // ========================================================
    // RENDERER
    // ========================================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.xr.enabled = true;


    renderer.xr.setReferenceSpaceType(
      "local-floor"
    );


    document.body.appendChild(
      renderer.domElement
    );


    // ========================================================
    // VR BUTTON
    // ========================================================

    const vrButton =
      VRButton.createButton(
        renderer
      );


    vrButton.style.display =
      "none";


    document.body.appendChild(
      vrButton
    );


    // ========================================================
    // MATERIALS
    // ========================================================

    const floorMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x303634,
        roughness: 0.8
      });


    const wallMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xd8ddd9,
        roughness: 0.9
      });


    const shelfMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x553d2c,
        roughness: 0.75
      });


    const metalMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x8b9290,
        metalness: 0.7,
        roughness: 0.3
      });


    const counterMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x222625,
        roughness: 0.65
      });


    // ========================================================
    // BOX FUNCTION
    // ========================================================

    function createBox(
      width,
      height,
      depth,
      material,
      x,
      y,
      z
    ) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          height,
          depth
        );


      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );


      mesh.position.set(
        x,
        y,
        z
      );


      scene.add(
        mesh
      );


      return mesh;
    }


    // ========================================================
    // FLOOR
    // ========================================================

    createBox(
      20,
      0.2,
      20,
      floorMaterial,
      0,
      -0.1,
      0
    );


    // ========================================================
    // WALLS
    // ========================================================

    createBox(
      20,
      5,
      0.3,
      wallMaterial,
      0,
      2.5,
      -10
    );


    createBox(
      0.3,
      5,
      20,
      wallMaterial,
      -10,
      2.5,
      0
    );


    createBox(
      0.3,
      5,
      20,
      wallMaterial,
      10,
      2.5,
      0
    );


    // Front wall with entrance

    createBox(
      7,
      5,
      0.3,
      wallMaterial,
      -6.5,
      2.5,
      10
    );


    createBox(
      7,
      5,
      0.3,
      wallMaterial,
      6.5,
      2.5,
      10
    );


    // ========================================================
    // CEILING
    // ========================================================

    createBox(
      20,
      0.2,
      20,
      wallMaterial,
      0,
      5,
      0
    );


    // ========================================================
    // SHELVES
    // ========================================================

    function createShelf(
      x,
      z
    ) {

      createBox(
        4,
        2.8,
        0.25,
        shelfMaterial,
        x,
        1.6,
        z
      );


      createBox(
        4.2,
        0.2,
        1.2,
        shelfMaterial,
        x,
        0.5,
        z + 0.35
      );


      createBox(
        4.2,
        0.2,
        1.2,
        shelfMaterial,
        x,
        1.35,
        z + 0.35
      );


      createBox(
        4.2,
        0.2,
        1.2,
        shelfMaterial,
        x,
        2.2,
        z + 0.35
      );


      createBox(
        0.2,
        2.8,
        1.2,
        shelfMaterial,
        x - 2,
        1.6,
        z + 0.35
      );


      createBox(
        0.2,
        2.8,
        1.2,
        shelfMaterial,
        x + 2,
        1.6,
        z + 0.35
      );


      // Products

      const productColors = [
        0xe74c3c,
        0x3498db,
        0xf1c40f,
        0x2ecc71,
        0x9b59b6
      ];


      const heights = [
        0.75,
        1.6,
        2.45
      ];


      heights.forEach(
        (height, row) => {

          for (
            let i = -1;
            i <= 1;
            i++
          ) {

            const material =
              new THREE.MeshStandardMaterial({
                color:
                  productColors[
                    (row + i + 3) %
                    productColors.length
                  ]
              });


            const product =
              new THREE.Mesh(
                new THREE.BoxGeometry(
                  0.42,
                  0.55,
                  0.42
                ),
                material
              );


            product.position.set(
              x + i * 1.15,
              height,
              z + 0.9
            );


            scene.add(
              product
            );

          }

        }
      );

    }


    createShelf(
      -6,
      -4
    );


    createShelf(
      0,
      -4
    );


    createShelf(
      6,
      -4
    );


    createShelf(
      -6,
      1
    );


    createShelf(
      6,
      1
    );


    // ========================================================
    // REFRIGERATOR
    // ========================================================

    createBox(
      5,
      3.2,
      1,
      metalMaterial,
      0,
      1.7,
      -8.7
    );


    const glassMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x6e9fa8,
        transparent: true,
        opacity: 0.35,
        metalness: 0.2,
        roughness: 0.1
      });


    for (
      let i = -1;
      i <= 1;
      i++
    ) {

      createBox(
        1.45,
        2.6,
        0.05,
        glassMaterial,
        i * 1.5,
        1.7,
        -9.25
      );

    }


    // ========================================================
    // CHECKOUT
    // ========================================================

    createBox(
      5,
      1.2,
      1.6,
      counterMaterial,
      0,
      0.6,
      5
    );


    createBox(
      5.3,
      0.15,
      1.8,
      metalMaterial,
      0,
      1.25,
      5
    );


    createBox(
      0.9,
      0.45,
      0.7,
      metalMaterial,
      0,
      1.55,
      5
    );


    // ========================================================
    // LIGHTING
    // ========================================================

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x39433f,
        2
      )
    );


    const mainLight =
      new THREE.DirectionalLight(
        0xffffff,
        2.5
      );


    mainLight.position.set(
      0,
      5,
      2
    );


    scene.add(
      mainLight
    );


    for (
      let x = -6;
      x <= 6;
      x += 6
    ) {

      const light =
        new THREE.PointLight(
          0xffffff,
          1.5,
          12
        );


      light.position.set(
        x,
        4.5,
        0
      );


      scene.add(
        light
      );

    }


    // ========================================================
    // CONTROLLERS
    // ========================================================

    let leftInput = null;
    let rightInput = null;


    function updateInputSources() {

      const session =
        renderer.xr.getSession();


      if (!session) {
        return;
      }


      leftInput = null;
      rightInput = null;


      for (
        const source of session.inputSources
      ) {

        if (
          source.handedness === "left" &&
          source.gamepad
        ) {

          leftInput =
            source;
        }


        if (
          source.handedness === "right" &&
          source.gamepad
        ) {

          rightInput =
            source;
        }

      }

    }


    renderer.xr.addEventListener(
      "sessionstart",
      () => {

        document
          .getElementById("startScreen")
          .classList.add("hidden");


        document
          .getElementById("desktopControls")
          .classList.add("hidden");


        updateInputSources();

      }
    );


    renderer.xr.addEventListener(
      "sessionend",
      () => {

        document
          .getElementById("startScreen")
          .classList.remove("hidden");


        document
          .getElementById("desktopControls")
          .classList.remove("hidden");

      }
    );


    // ========================================================
    // JOYSTICK
    // ========================================================

    function axis(
      gamepad,
      index
    ) {

      if (
        !gamepad ||
        !gamepad.axes ||
        gamepad.axes.length <= index
      ) {

        return 0;
      }


      const value =
        gamepad.axes[index];


      if (
        Math.abs(value) < 0.15
      ) {

        return 0;
      }


      return value;
    }


    function updateVRMovement(
      delta
    ) {

      if (
        !renderer.xr.isPresenting
      ) {

        return;
      }


      updateInputSources();


      // ------------------------------------------------------
      // LEFT JOYSTICK
      // ------------------------------------------------------

      if (
        leftInput &&
        leftInput.gamepad
      ) {

        const stickX =
          axis(
            leftInput.gamepad,
            2
          );


        const stickY =
          axis(
            leftInput.gamepad,
            3
          );


        movePlayer(
          stickY,
          stickX,
          delta
        );

      }


      // ------------------------------------------------------
      // RIGHT JOYSTICK
      // ------------------------------------------------------

      if (
        rightInput &&
        rightInput.gamepad
      ) {

        const stickX =
          axis(
            rightInput.gamepad,
            2
          );


        turnPlayer(
          stickX,
          delta
        );

      }


      // Copy game position to
      // the actual VR player.

      playerGroup.position.x =
        player.position.x;


      playerGroup.position.z =
        player.position.z;


      playerGroup.rotation.y =
        player.rotation;

    }


    // ========================================================
    // DESKTOP TEST
    // ========================================================

    const keys = {};


    window.addEventListener(
      "keydown",
      (event) => {

        keys[
          event.key.toLowerCase()
        ] = true;

      }
    );


    window.addEventListener(
      "keyup",
      (event) => {

        keys[
          event.key.toLowerCase()
        ] = false;

      }
    );


    function desktopMovement(
      delta
    ) {

      if (
        renderer.xr.isPresenting
      ) {

        return;
      }


      let forward = 0;
      let sideways = 0;


      if (keys["w"]) {
        forward -= 1;
      }


      if (keys["s"]) {
        forward += 1;
      }


      if (keys["a"]) {
        sideways -= 1;
      }


      if (keys["d"]) {
        sideways += 1;
      }


      if (
        forward !== 0 ||
        sideways !== 0
      ) {

        movePlayer(
          forward,
          sideways,
          delta
        );

      }


      if (keys["q"]) {

        turnPlayer(
          -1,
          delta
        );

      }


      if (keys["e"]) {

        turnPlayer(
          1,
          delta
        );

      }


      playerGroup.position.x =
        player.position.x;


      playerGroup.position.z =
        player.position.z;


      playerGroup.rotation.y =
        player.rotation;

    }


    // ========================================================
    // ENTER VR
    // ========================================================

    const enterButton =
      document.getElementById(
        "enterVR"
      );


    const status =
      document.getElementById(
        "status"
      );


    enterButton.addEventListener(
      "click",
      async () => {

        if (
          !navigator.xr
        ) {

          status.textContent =
            "WebXR is not available. Open this page in the Meta Quest browser.";

          return;
        }


        try {

          const supported =
            await navigator.xr.isSessionSupported(
              "immersive-vr"
            );


          if (!supported) {

            status.textContent =
              "Immersive VR is not supported by this browser.";

            return;
          }


          vrButton.click();

        } catch (error) {

          console.error(
            error
          );


          status.textContent =
            "Unable to start VR.";

        }

      }
    );


    // ========================================================
    // VR SUPPORT CHECK
    // ========================================================

    if (
      navigator.xr
    ) {

      navigator.xr
        .isSessionSupported(
          "immersive-vr"
        )
        .then(
          (supported) => {

            if (supported) {

              status.textContent =
                "VR is supported. You're ready to enter the store!";

            } else {

              status.textContent =
                "Open this page using your Meta Quest browser.";

            }

          }
        )
        .catch(
          () => {

            status.textContent =
              "Open this page using your Meta Quest browser.";

          }
        );

    } else {

      status.textContent =
        "Open this page using your Meta Quest browser.";

    }


    // ========================================================
    // RESIZE
    // ========================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // ========================================================
    // GAME LOOP
    // ========================================================

    const clock =
      new THREE.Clock();


    function gameLoop() {

      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      updateVRMovement(
        delta
      );


      desktopMovement(
        delta
      );


      renderer.render(
        scene,
        camera
      );

    }


    renderer.setAnimationLoop(
      gameLoop
    );

  </script>

</body>
</html>
