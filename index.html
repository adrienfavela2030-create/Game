<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#07150f"
  >

  <title>Survival VR</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <!--
    Three.js
    The importmap lets all of our JavaScript files use:
    import * as THREE from "three";
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- ========================================================
       START SCREEN
       ======================================================== -->

  <div id="startScreen">

    <div class="startPanel">

      <div class="gameLogo">
        SURVIVAL
        <span>VR</span>
      </div>

      <p class="startDescription">
        Explore a procedurally generated island,
        gather resources, craft tools, build shelter,
        and survive.
      </p>

      <button
        id="startButton"
        type="button"
      >
        START SURVIVAL
      </button>

      <div id="vrStatus">
        Checking VR...
      </div>

    </div>

  </div>


  <!-- ========================================================
       GAME HUD
       ======================================================== -->

  <div
    id="hud"
    class="hidden"
  >

    <div class="hudStats">

      <div class="stat">
        <span class="statLabel">
          HEALTH
        </span>

        <span id="healthDisplay">
          100
        </span>
      </div>

      <div class="stat">
        <span class="statLabel">
          HUNGER
        </span>

        <span id="hungerDisplay">
          100
        </span>
      </div>

      <div class="stat">
        <span class="statLabel">
          THIRST
        </span>

        <span id="thirstDisplay">
          100
        </span>
      </div>

      <div class="stat">
        <span class="statLabel">
          STAMINA
        </span>

        <span id="staminaDisplay">
          100
        </span>
      </div>

    </div>


    <div id="worldInfo">

      <div>
        DAY
        <span id="dayDisplay">
          1
        </span>
      </div>

      <div>
        TIME
        <span id="timeDisplay">
          08:00
        </span>
      </div>

    </div>

  </div>


  <!-- ========================================================
       MESSAGE TOAST
       ======================================================== -->

  <div
    id="message"
    class="hidden"
  ></div>


  <!-- ========================================================
       SYSTEM UI CONTAINERS
       ======================================================== -->

  <!-- Inventory creates its own contents here. -->
  <div
    id="inventoryContainer"
    class="systemContainer"
  ></div>

  <!-- Crafting creates its own contents here. -->
  <div
    id="craftingContainer"
    class="systemContainer"
  ></div>

  <!-- Building creates its own contents here. -->
  <div
    id="buildingContainer"
    class="systemContainer"
  ></div>

  <!-- Guide creates its own contents here. -->
  <div
    id="guideContainer"
    class="systemContainer"
  ></div>

  <!-- Save system creates its own contents here. -->
  <div
    id="saveContainer"
    class="systemContainer"
  ></div>

  <!-- Home system creates its own contents here. -->
  <div
    id="homeContainer"
    class="systemContainer"
  ></div>

  <!-- Settings system creates its own contents here. -->
  <div
    id="settingsContainer"
    class="systemContainer"
  ></div>


  <!-- ========================================================
       LOADING
       ======================================================== -->

  <div
    id="loadingScreen"
    class="hidden"
  >

    <div class="loadingPanel">

      <div class="loadingTitle">
        GENERATING ISLAND
      </div>

      <div class="loadingBar">
        <div
          id="loadingProgress"
          class="loadingProgress"
        ></div>
      </div>

      <div id="loadingText">
        Preparing world...
      </div>

    </div>

  </div>


  <!-- ========================================================
       PAUSE
       ======================================================== -->

  <div
    id="pauseScreen"
    class="hidden"
  >

    <div class="pausePanel">

      <div class="pauseTitle">
        PAUSED
      </div>

      <p>
        Open the survival menu to continue.
      </p>

      <button
        id="resumeButton"
        type="button"
      >
        RESUME
      </button>

    </div>

  </div>


  <!-- ========================================================
       VR BUTTON
       ======================================================== -->

  <div id="vrButton"></div>


  <!-- ========================================================
       MAIN GAME SCRIPT
       ======================================================== -->

  <script type="module">

    /*
     * IMPORTANT:
     *
     * game.js and hands.js are loaded first.
     *
     * SurvivalVR is created before the rest of the
     * systems are dynamically imported.
     *
     * This prevents the ES-module initialization
     * problem where a system tries to access
     * window.SurvivalVR before it exists.
     */

    import * as THREE from "three";

    import {
      VRButton
    } from "three/addons/webxr/VRButton.js";

    import {
      GAME,
      player,
      gameEvent,
      updateSurvival,
      setPaused,
      setVRState,
      setSprinting
    } from "./game.js";

    import {
      setupHands,
      updateHands
    } from "./hands.js";


    // ========================================================
    // SURVIVAL VR CORE
    // ========================================================

    window.SurvivalVR = {

      THREE,

      GAME,

      player,

      scene: null,

      camera: null,

      renderer: null,

      playerGroup: null,

      controllers: [],

      objects: [],

      resources: [],

      buildings: [],

      heldItems: {
        left: null,
        right: null
      },

      systems: {

        inventory: null,

        crafting: null,

        building: null,

        guide: null,

        world: null,

        home: null,

        settings: null,

        save: null,

        audio: null,

        environment: null,

        animals: null

      },

      ready: false,

      worldData: null,

      world: null,

      hands: null,

      updateHands: null,

      rendererInitialized: false

    };


    // ========================================================
    // DOM
    // ========================================================

    const startScreen =
      document.getElementById(
        "startScreen"
      );

    const startButton =
      document.getElementById(
        "startButton"
      );

    const vrStatus =
      document.getElementById(
        "vrStatus"
      );

    const hud =
      document.getElementById(
        "hud"
      );

    const message =
      document.getElementById(
        "message"
      );

    const vrButton =
      document.getElementById(
        "vrButton"
      );

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );

    const loadingProgress =
      document.getElementById(
        "loadingProgress"
      );

    const loadingText =
      document.getElementById(
        "loadingText"
      );

    const pauseScreen =
      document.getElementById(
        "pauseScreen"
      );

    const resumeButton =
      document.getElementById(
        "resumeButton"
      );


    // ========================================================
    // GAME STATE
    // ========================================================

    let initialized =
      false;

    let systemsLoaded =
      false;

    let lastFrameTime =
      performance.now();

    let messageTimer =
      null;


    // ========================================================
    // MESSAGE
    // ========================================================

    function showMessage(
      text,
      duration = 2500
    ) {

      if (!message) {
        return;
      }

      message.textContent =
        text;

      message.classList.remove(
        "hidden"
      );

      clearTimeout(
        messageTimer
      );

      messageTimer =
        setTimeout(
          () => {
            message.classList.add(
              "hidden"
            );
          },
          duration
        );

    }


    window.SurvivalVR.showMessage =
      showMessage;


    // ========================================================
    // LOADING
    // ========================================================

    function setLoading(
      percent,
      text
    ) {

      if (
        loadingProgress
      ) {
        loadingProgress.style.width =
          `${percent}%`;
      }

      if (
        loadingText &&
        text
      ) {
        loadingText.textContent =
          text;
      }

    }


    function showLoading(
      text =
        "Preparing world..."
    ) {

      if (!loadingScreen) {
        return;
      }

      loadingScreen.classList.remove(
        "hidden"
      );

      setLoading(
        0,
        text
      );

    }


    function hideLoading() {

      if (!loadingScreen) {
        return;
      }

      setLoading(
        100,
        "Ready!"
      );

      setTimeout(
        () => {
          loadingScreen.classList.add(
            "hidden"
          );
        },
        250
      );

    }


    // ========================================================
    // RENDERER
    // ========================================================

    function createRenderer() {

      if (
        window.SurvivalVR.renderer
      ) {
        return window.SurvivalVR.renderer;
      }

      const renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          powerPreference:
            "high-performance"
        });

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio ||
            1,
          1.5
        )
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled =
        true;

      renderer.shadowMap.enabled =
        true;

      renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

      renderer.outputColorSpace =
        THREE.SRGBColorSpace;

      renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

      renderer.toneMappingExposure =
        1;

      document.body.appendChild(
        renderer.domElement
      );

      window.SurvivalVR.renderer =
        renderer;

      window.SurvivalVR.rendererInitialized =
        true;

      return renderer;

    }


    // ========================================================
    // SCENE
    // ========================================================

    function createScene() {

      if (
        window.SurvivalVR.scene
      ) {
        return window.SurvivalVR.scene;
      }

      const scene =
        new THREE.Scene();

      scene.background =
        new THREE.Color(
          0x78bde0
        );

      scene.fog =
        new THREE.Fog(
          0x78bde0,
          45,
          100
        );

      window.SurvivalVR.scene =
        scene;

      return scene;

    }


    // ========================================================
    // CAMERA
    // ========================================================

    function createCamera() {

      if (
        window.SurvivalVR.camera
      ) {
        return window.SurvivalVR.camera;
      }

      const camera =
        new THREE.PerspectiveCamera(
          70,
          window.innerWidth /
            window.innerHeight,
          0.03,
          150
        );

      camera.position.set(
        0,
        1.65,
        0
      );

      window.SurvivalVR.camera =
        camera;

      return camera;

    }


    // ========================================================
    // PLAYER GROUP
    // ========================================================

    function createPlayerGroup() {

      if (
        window.SurvivalVR.playerGroup
      ) {
        return window.SurvivalVR.playerGroup;
      }

      const playerGroup =
        new THREE.Group();

      playerGroup.name =
        "Player";

      playerGroup.add(
        window.SurvivalVR.camera
      );

      window.SurvivalVR.scene.add(
        playerGroup
      );

      window.SurvivalVR.playerGroup =
        playerGroup;

      return playerGroup;

    }


    // ========================================================
    // VR BUTTON
    // ========================================================

    function createVRButton() {

      if (
        !window.SurvivalVR.renderer
      ) {
        return;
      }

      if (
        !vrButton
      ) {
        return;
      }

      vrButton.innerHTML =
        "";

      const button =
        VRButton.createButton(
          window.SurvivalVR.renderer
        );

      button.id =
        "survivalVRButton";

      vrButton.appendChild(
        button
      );

      window.SurvivalVR.renderer.xr
        .addEventListener(
          "sessionstart",
          () => {

            setVRState(
              true
            );

            if (
              vrStatus
            ) {
              vrStatus.textContent =
                "VR ACTIVE";
            }

            gameEvent(
              "survival-vr-started"
            );

          }
        );

      window.SurvivalVR.renderer.xr
        .addEventListener(
          "sessionend",
          () => {

            setVRState(
              false
            );

            if (
              vrStatus
            ) {
              vrStatus.textContent =
                "VR READY";
            }

            gameEvent(
              "survival-vr-ended"
            );

          }
        );

    }


    // ========================================================
    // SYSTEM LOADER
    // ========================================================

    async function loadSystems() {

      if (
        systemsLoaded
      ) {
        return;
      }

      setLoading(
        10,
        "Loading survival systems..."
      );

      /*
       * These are intentionally dynamic imports.
       *
       * SurvivalVR already exists at this point.
       */

      await import(
        "./inventory.js"
      );

      setLoading(
        20,
        "Loading inventory..."
      );

      await import(
        "./crafting.js"
      );

      setLoading(
        28,
        "Loading crafting..."
      );

      await import(
        "./building.js"
      );

      setLoading(
        36,
        "Loading building..."
      );

      await import(
        "./guide.js"
      );

      setLoading(
        44,
        "Loading guide..."
      );

      await import(
        "./world.js"
      );

      setLoading(
        54,
        "Generating world system..."
      );

      await import(
        "./save.js"
      );

      setLoading(
        62,
        "Loading save system..."
      );

      await import(
        "./home.js"
      );

      setLoading(
        69,
        "Loading home..."
      );

      await import(
        "./settings.js"
      );

      setLoading(
        76,
        "Loading settings..."
      );

      await import(
        "./audio.js"
      );

      setLoading(
        82,
        "Loading audio..."
      );

      await import(
        "./environment.js"
      );

      setLoading(
        88,
        "Loading environment..."
      );

      await import(
        "./animals.js"
      );

      setLoading(
        94,
        "Loading animals..."
      );


      systemsLoaded =
        true;

      window.SurvivalVR.ready =
        true;

      gameEvent(
        "survival-systems-loaded"
      );

      setLoading(
        100,
        "Systems ready."
      );

    }


    // ========================================================
    // HANDS
    // ========================================================

    function initializeHands() {

      if (
        typeof setupHands !==
        "function"
      ) {
        return;
      }

      setupHands(
        window.SurvivalVR.renderer,
        window.SurvivalVR.camera,
        window.SurvivalVR.scene
      );

    }


    // ========================================================
    // START GAME
    // ========================================================

    async function startGame() {

      if (
        initialized
      ) {
        return;
      }

      initialized =
        true;

      startButton.disabled =
        true;

      showLoading(
        "Starting Survival VR..."
      );

      try {

        setLoading(
          5,
          "Creating renderer..."
        );

        createRenderer();

        setLoading(
          8,
          "Creating scene..."
        );

        createScene();

        setLoading(
          12,
          "Creating camera..."
        );

        createCamera();

        setLoading(
          15,
          "Creating player..."
        );

        createPlayerGroup();

        setLoading(
          18,
          "Connecting VR..."
        );

        createVRButton();

        setLoading(
          20,
          "Connecting systems..."
        );

        initializeHands();

        await loadSystems();

        setLoading(
          96,
          "Preparing island..."
        );


        // ----------------------------------------------------
        // GENERATE WORLD
        // ----------------------------------------------------

        if (
          window.SurvivalVR.systems.world
        ) {

          const worldSystem =
            window.SurvivalVR.systems.world;

          if (
            typeof worldSystem.generateWorld ===
            "function"
          ) {

            worldSystem.generateWorld();

          }

        }


        // ----------------------------------------------------
        // START AUDIO
        // ----------------------------------------------------

        if (
          window.SurvivalVR.systems.audio
        ) {

          await window.SurvivalVR
            .systems
            .audio
            .start();

        }


        // ----------------------------------------------------
        // INITIALIZE ENVIRONMENT
        // ----------------------------------------------------

        if (
          window.SurvivalVR.systems
            .environment
        ) {

          window.SurvivalVR.systems
            .environment
            .initialize();

        }


        // ----------------------------------------------------
        // INITIALIZE ANIMALS
        // ----------------------------------------------------

        if (
          window.SurvivalVR.systems
            .animals
        ) {

          window.SurvivalVR.systems
            .animals
            .initialize();

        }


        // ----------------------------------------------------
        // GAME STARTED
        // ----------------------------------------------------

        GAME.state.started =
          true;

        GAME.state.paused =
          false;

        GAME.state.gameOver =
          false;

        setPaused(
          false
        );


        startScreen.classList.add(
          "hidden"
        );

        hud.classList.remove(
          "hidden"
        );


        gameEvent(
          "survival-game-started"
        );


        hideLoading();

        showMessage(
          "Welcome to your island.",
          3500
        );

        lastFrameTime =
          performance.now();

        requestAnimationFrame(
          firstFrame
        );

      } catch (
        error
      ) {

        console.error(
          "[SurvivalVR] Failed to start:",
          error
        );

        initialized =
          false;

        startButton.disabled =
          false;

        setLoading(
          100,
          "Startup failed."
        );

        showMessage(
          "The game could not start. Check the console.",
          5000
        );

      }

    }


    function firstFrame(
      time
    ) {

      lastFrameTime =
        time;

      requestAnimationFrame(
        animate
      );

    }


    // ========================================================
    // MAIN GAME LOOP
    // ========================================================

    function animate(
      time
    ) {

      const delta =
        Math.min(
          (time -
            lastFrameTime) /
            1000,
          0.1
        );

      lastFrameTime =
        time;


      // ------------------------------------------------------
      // SURVIVAL
      // ------------------------------------------------------

      if (
        GAME.state.started &&
        !GAME.state.paused &&
        !GAME.state.gameOver
      ) {

        updateSurvival(
          delta
        );

      }


      // ------------------------------------------------------
      // HANDS
      // ------------------------------------------------------

      if (
        typeof updateHands ===
        "function"
      ) {

        updateHands(
          delta
        );

      } else if (
        typeof window.SurvivalVR
          .updateHands ===
        "function"
      ) {

        window.SurvivalVR
          .updateHands(
            delta
          );

      }


      // ------------------------------------------------------
      // WORLD
      // ------------------------------------------------------

      if (
        window.SurvivalVR.systems
          .world?.update
      ) {

        window.SurvivalVR.systems
          .world
          .update(
            delta
          );

      }


      // ------------------------------------------------------
      // ENVIRONMENT
      // ------------------------------------------------------

      if (
        window.SurvivalVR.systems
          .environment?.update
      ) {

        window.SurvivalVR.systems
          .environment
          .update(
            delta
          );

      }


      // ------------------------------------------------------
      // ANIMALS
      // ------------------------------------------------------

      if (
        window.SurvivalVR.systems
          .animals?.update
      ) {

        window.SurvivalVR.systems
          .animals
          .update(
            delta
          );

      }


      // ------------------------------------------------------
      // BUILDING
      // ------------------------------------------------------

      if (
        window.SurvivalVR.systems
          .building?.update
      ) {

        window.SurvivalVR.systems
          .building
          .update(
            delta
          );

      }


      // ------------------------------------------------------
      // RENDER
      // ------------------------------------------------------

      if (
        window.SurvivalVR.renderer &&
        window.SurvivalVR.scene &&
        window.SurvivalVR.camera
      ) {

        window.SurvivalVR.renderer.render(
          window.SurvivalVR.scene,
          window.SurvivalVR.camera
        );

      }

    }


    // ========================================================
    // HUD
    // ========================================================

    function updateHUD() {

      if (!hud) {
        return;
      }

      const playerState =
        GAME.player ||
        {};

      const health =
        document.getElementById(
          "healthDisplay"
        );

      const hunger =
        document.getElementById(
          "hungerDisplay"
        );

      const thirst =
        document.getElementById(
          "thirstDisplay"
        );

      const stamina =
        document.getElementById(
          "staminaDisplay"
        );

      const day =
        document.getElementById(
          "dayDisplay"
        );

      const time =
        document.getElementById(
          "timeDisplay"
        );


      if (health) {
        health.textContent =
          Math.round(
            playerState.health ??
            100
          );
      }

      if (hunger) {
        hunger.textContent =
          Math.round(
            playerState.hunger ??
            100
          );
      }

      if (thirst) {
        thirst.textContent =
          Math.round(
            playerState.thirst ??
            100
          );
      }

      if (stamina) {
        stamina.textContent =
          Math.round(
            playerState.stamina ??
            100
          );
      }


      if (day) {
        day.textContent =
          GAME.world?.day ??
          1;
      }


      if (time) {

        const worldTime =
          Number(
            GAME.world?.time
          ) || 0;

        const hours =
          Math.floor(
            worldTime
          );

        const minutes =
          Math.floor(
            (worldTime -
              hours) *
              60
          );

        time.textContent =
          `${String(
            hours
          ).padStart(
            2,
            "0"
          )}:${String(
            minutes
          ).padStart(
            2,
            "0"
          )}`;

      }

    }


    // ========================================================
    // HUD UPDATE TIMER
    // ========================================================

    setInterval(
      () => {

        if (
          GAME.state.started
        ) {

          updateHUD();

        }

      },
      200
    );


    // ========================================================
    // PAUSE
    // ========================================================

    function showPause() {

      if (
        pauseScreen
      ) {

        pauseScreen.classList.remove(
          "hidden"
        );

      }

    }


    function hidePause() {

      if (
        pauseScreen
      ) {

        pauseScreen.classList.add(
          "hidden"
        );

      }

    }


    function togglePause() {

      if (
        !GAME.state.started ||
        GAME.state.gameOver
      ) {
        return;
      }

      const paused =
        !GAME.state.paused;

      setPaused(
        paused
      );

      if (paused) {
        showPause();
      } else {
        hidePause();
      }

    }


    // ========================================================
    // RESUME
    // ========================================================

    if (
      resumeButton
    ) {

      resumeButton.addEventListener(
        "click",
        () => {

          setPaused(
            false
          );

          hidePause();

        }
      );

    }


    // ========================================================
    // KEYBOARD
    // ========================================================

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          if (
            GAME.state.started &&
            !GAME.state.gameOver
          ) {

            togglePause();

          }

        }

        if (
          event.key ===
          "Shift"
        ) {

          setSprinting(
            true
          );

        }

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        if (
          event.key ===
          "Shift"
        ) {

          setSprinting(
            false
          );

        }

      }
    );


    // ========================================================
    // RESIZE
    // ========================================================

    window.addEventListener(
      "resize",
      () => {

        const camera =
          window.SurvivalVR.camera;

        const renderer =
          window.SurvivalVR.renderer;

        if (
          camera
        ) {

          camera.aspect =
            window.innerWidth /
            window.innerHeight;

          camera.updateProjectionMatrix();

        }

        if (
          renderer
        ) {

          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );

        }

      }
    );


    // ========================================================
    // START BUTTON
    // ========================================================

    if (
      startButton
    ) {

      startButton.addEventListener(
        "click",
        startGame
      );

    }


    // ========================================================
    // CHECK VR
    // ========================================================

    async function checkVR() {

      if (
        !vrStatus
      ) {
        return;
      }

      if (
        !navigator.xr
      ) {

        vrStatus.textContent =
          "WebXR not available";

        return;

      }

      try {

        const supported =
          await navigator.xr
            .isSessionSupported(
              "immersive-vr"
            );

        if (
          supported
        ) {

          vrStatus.textContent =
            "VR READY";

        } else {

          vrStatus.textContent =
            "VR NOT AVAILABLE";

        }

      } catch (
        error
      ) {

        console.warn(
          "[SurvivalVR] VR check failed:",
          error
        );

        vrStatus.textContent =
          "VR CHECK FAILED";

      }

    }


    // ========================================================
    // SYSTEM EVENTS
    // ========================================================

    window.addEventListener(
      "survival-game-over",
      () => {

        GAME.state.gameOver =
          true;

        GAME.state.paused =
          false;

        hidePause();

        showMessage(
          "You did not survive.",
          5000
        );

      }
    );


    window.addEventListener(
      "survival-new-day",
      () => {

        showMessage(
          `Day ${
            GAME.world?.day ||
            1
          } has begun.`,
          3000
        );

      }
    );


    window.addEventListener(
      "survival-night-started",
      () => {

        showMessage(
          "Night is falling.",
          3000
        );

      }
    );


    window.addEventListener(
      "survival-world-generated",
      event => {

        const seed =
          event.detail?.seed ||
          GAME.world?.seed ||
          "Unknown";

        console.log(
          "[SurvivalVR] World generated:",
          seed
        );

      }
    );


    // ========================================================
    // INITIAL VR CHECK
    // ========================================================

    checkVR();

  </script>

</body>
</html>
