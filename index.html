<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Island Survival VR</title>

  <link rel="stylesheet" href="./style.css">

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- =========================================================
       START SCREEN
  ========================================================== -->

  <div id="start-screen">

    <div class="start-panel">

      <div class="game-logo">
        <div class="logo-small">ISLAND</div>
        <div class="logo-big">SURVIVAL</div>
        <div class="logo-vr">VR</div>
      </div>

      <p class="start-description">
        Explore a mysterious island, gather resources,
        craft tools, build shelter and survive.
      </p>

      <button id="start-game" class="primary-button">
        START SURVIVAL
      </button>

      <button id="continue-game" class="secondary-button">
        CONTINUE
      </button>

      <div id="vr-button-container"></div>

      <div class="start-tip">
        Best experienced in Meta Quest VR
      </div>

    </div>

  </div>


  <!-- =========================================================
       LOADING
  ========================================================== -->

  <div id="loading-screen" style="display:none;">

    <div class="loading-panel">

      <div class="loading-title">
        GENERATING ISLAND
      </div>

      <div class="loading-bar">
        <div id="loading-progress"></div>
      </div>

      <div id="loading-text">
        Creating world...
      </div>

    </div>

  </div>


  <!-- =========================================================
       HUD
  ========================================================== -->

  <div id="hud">

    <div id="hud-top">

      <div class="stat-box">
        <span class="stat-label">HP</span>
        <span id="health-value">100</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">HUNGER</span>
        <span id="hunger-value">100</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">THIRST</span>
        <span id="thirst-value">100</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">STAMINA</span>
        <span id="stamina-value">100</span>
      </div>

    </div>


    <div id="hud-bottom">

      <div id="held-left" class="hand-slot">
        LEFT
      </div>

      <div id="crosshair">
        +
      </div>

      <div id="held-right" class="hand-slot">
        RIGHT
      </div>

    </div>


    <div id="message">
    </div>

  </div>


  <!-- =========================================================
       PAUSE SCREEN
  ========================================================== -->

  <div id="pause-screen" style="display:none;">

    <div class="pause-panel">

      <h1>PAUSED</h1>

      <button id="pause-resume" class="primary-button">
        RESUME
      </button>

      <button id="pause-home" class="secondary-button">
        HOME
      </button>

    </div>

  </div>


  <!-- =========================================================
       GAME SCRIPT
  ========================================================== -->

  <script type="module">

    /*
     * ============================================================
     * ISLAND SURVIVAL VR
     *
     * IMPORTANT XR ARCHITECTURE
     * ------------------------------------------------------------
     *
     * The Quest headset controls the XR camera.
     *
     * We DO NOT manually overwrite the headset camera position.
     *
     * Instead:
     *
     * scene
     *   └── playerRig
     *          └── camera
     *
     * The playerRig controls world movement.
     *
     * WebXR controls the camera's headset movement.
     *
     * This prevents the headset from freezing after the first
     * frame.
     * ============================================================
     */

    import * as THREE from "three";

    import { VRButton } from "three/addons/webxr/VRButton.js";


    // ============================================================
    // BASIC GLOBAL OBJECT
    // ============================================================

    const SurvivalVR = {

      THREE,

      scene: null,
      camera: null,
      renderer: null,

      playerRig: null,

      clock: new THREE.Clock(),

      GAME: null,
      player: null,

      systems: {},

      worldData: null,
      resources: [],

      buildings: [],

      hands: null,

      isXR: false,

      started: false,

      lastFrameTime: 0,

      ui: {}

    };


    /*
     * Create the global object BEFORE importing any of the
     * game modules.
     *
     * Several of our modules access window.SurvivalVR when
     * they load.
     */

    window.SurvivalVR = SurvivalVR;


    // ============================================================
    // SCENE
    // ============================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    SurvivalVR.scene = scene;


    // ============================================================
    // PLAYER RIG
    // ============================================================

    const playerRig = new THREE.Group();

    playerRig.name = "PlayerRig";

    playerRig.position.set(0, 0, 0);

    scene.add(playerRig);

    SurvivalVR.playerRig = playerRig;


    // ============================================================
    // CAMERA
    // ============================================================

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.05,
      1000
    );

    camera.name = "PlayerCamera";

    /*
     * This is the player's local eye height.
     *
     * IMPORTANT:
     * We keep the camera's local position.
     * We do NOT update this position every frame.
     *
     * Quest WebXR will handle headset movement.
     */

    camera.position.set(0, 1.65, 0);

    camera.rotation.set(0, 0, 0);

    playerRig.add(camera);

    SurvivalVR.camera = camera;


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.xr.enabled = true;

    /*
     * local-floor is important for Quest.
     *
     * This lets WebXR use the floor-relative tracking space
     * instead of a normal browser camera.
     */

    renderer.xr.setReferenceSpaceType("local-floor");

    document.body.appendChild(renderer.domElement);

    SurvivalVR.renderer = renderer;


    // ============================================================
    // XR BUTTON
    // ============================================================

    const vrButton = VRButton.createButton(renderer, {

      optionalFeatures: [
        "local-floor",
        "bounded-floor",
        "hand-tracking"
      ]

    });

    vrButton.id = "enter-vr-button";

    const vrContainer =
      document.getElementById("vr-button-container");

    if (vrContainer) {
      vrContainer.appendChild(vrButton);
    } else {
      document.body.appendChild(vrButton);
    }


    // ============================================================
    // UI REFERENCES
    // ============================================================

    SurvivalVR.ui.startScreen =
      document.getElementById("start-screen");

    SurvivalVR.ui.startGame =
      document.getElementById("start-game");

    SurvivalVR.ui.continueGame =
      document.getElementById("continue-game");

    SurvivalVR.ui.loading =
      document.getElementById("loading-screen");

    SurvivalVR.ui.loadingProgress =
      document.getElementById("loading-progress");

    SurvivalVR.ui.loadingText =
      document.getElementById("loading-text");

    SurvivalVR.ui.hud =
      document.getElementById("hud");

    SurvivalVR.ui.message =
      document.getElementById("message");

    SurvivalVR.ui.pause =
      document.getElementById("pause-screen");

    SurvivalVR.ui.pauseResume =
      document.getElementById("pause-resume");

    SurvivalVR.ui.pauseHome =
      document.getElementById("pause-home");


    // ============================================================
    // HELPER FUNCTIONS
    // ============================================================

    function showLoading(text, progress = 0) {

      const loading = SurvivalVR.ui.loading;

      if (loading) {
        loading.style.display = "flex";
      }

      if (SurvivalVR.ui.loadingText) {
        SurvivalVR.ui.loadingText.textContent = text;
      }

      if (SurvivalVR.ui.loadingProgress) {
        SurvivalVR.ui.loadingProgress.style.width =
          `${Math.max(0, Math.min(100, progress))}%`;
      }
    }


    function hideLoading() {

      if (SurvivalVR.ui.loading) {
        SurvivalVR.ui.loading.style.display = "none";
      }

    }


    function showMessage(text, duration = 2500) {

      const message = SurvivalVR.ui.message;

      if (!message) return;

      message.textContent = text;

      message.classList.add("show");

      clearTimeout(showMessage.timer);

      showMessage.timer = setTimeout(() => {

        message.classList.remove("show");

      }, duration);

    }


    // ============================================================
    // LOAD GAME CORE
    // ============================================================

    showLoading("Loading survival systems...", 5);

    let gameModule;

    try {

      gameModule = await import("./game.js");

      SurvivalVR.GAME = gameModule.GAME;

      SurvivalVR.player = gameModule.player;

      /*
       * Give modules access to the game's exported functions.
       */

      SurvivalVR.gameEvent =
        gameModule.gameEvent;

      SurvivalVR.updateSurvival =
        gameModule.updateSurvival;

      SurvivalVR.setPaused =
        gameModule.setPaused;

      SurvivalVR.setVRState =
        gameModule.setVRState;

      SurvivalVR.setSprinting =
        gameModule.setSprinting;

      SurvivalVR.movePlayer =
        gameModule.movePlayer;

      SurvivalVR.turnPlayer =
        gameModule.turnPlayer;

      SurvivalVR.setPlayerPosition =
        gameModule.setPlayerPosition;

      SurvivalVR.getGameData =
        gameModule.getGameData;

      SurvivalVR.createNewWorld =
        gameModule.createNewWorld;

      SurvivalVR.loadGameData =
        gameModule.loadGameData;

    } catch (error) {

      console.error(
        "GAME.JS FAILED TO LOAD:",
        error
      );

      showMessage(
        "Game core failed to load. Check GitHub files.",
        6000
      );

      hideLoading();

      throw error;

    }


    // ============================================================
    // LOAD SYSTEMS
    // ============================================================

    showLoading("Loading world system...", 15);

    try {

      SurvivalVR.systems.world =
        await import("./world.js");

      showLoading("Loading hands...", 25);

      SurvivalVR.systems.hands =
        await import("./hands.js");

      showLoading("Loading inventory...", 35);

      SurvivalVR.systems.inventory =
        await import("./inventory.js");

      showLoading("Loading crafting...", 45);

      SurvivalVR.systems.crafting =
        await import("./crafting.js");

      showLoading("Loading building...", 55);

      SurvivalVR.systems.building =
        await import("./building.js");

      showLoading("Loading guide...", 62);

      SurvivalVR.systems.guide =
        await import("./guide.js");

      showLoading("Loading save system...", 69);

      SurvivalVR.systems.save =
        await import("./save.js");

      showLoading("Loading home...", 75);

      SurvivalVR.systems.home =
        await import("./home.js");

      showLoading("Loading settings...", 81);

      SurvivalVR.systems.settings =
        await import("./settings.js");

      showLoading("Loading audio...", 87);

      SurvivalVR.systems.audio =
        await import("./audio.js");

      showLoading("Loading environment...", 93);

      SurvivalVR.systems.environment =
        await import("./environment.js");

      showLoading("Loading animals...", 97);

      SurvivalVR.systems.animals =
        await import("./animals.js");

    } catch (error) {

      console.error(
        "SYSTEM LOAD ERROR:",
        error
      );

      console.error(error.stack);

      showMessage(
        "A survival system failed to load.",
        7000
      );

      hideLoading();

      throw error;

    }


    // ============================================================
    // HANDS
    // ============================================================

    /*
     * IMPORTANT:
     *
     * hands.js is loaded only AFTER SurvivalVR exists.
     *
     * This fixes the old initialization-order problem.
     */

    try {

      if (
        SurvivalVR.systems.hands &&
        typeof SurvivalVR.systems.hands.setupHands === "function"
      ) {

        SurvivalVR.hands =
          SurvivalVR.systems.hands.setupHands();

      }

    } catch (error) {

      console.error(
        "HANDS SETUP ERROR:",
        error
      );

    }


    // ============================================================
    // INITIALIZE OTHER SYSTEMS
    // ============================================================

    try {

      if (
        SurvivalVR.systems.inventory &&
        typeof SurvivalVR.systems.inventory.setupInventory === "function"
      ) {

        SurvivalVR.systems.inventory.setupInventory();

      }

    } catch (error) {

      console.warn(
        "Inventory setup:",
        error
      );

    }


    try {

      if (
        SurvivalVR.systems.crafting &&
        typeof SurvivalVR.systems.crafting.setupCrafting === "function"
      ) {

        SurvivalVR.systems.crafting.setupCrafting();

      }

    } catch (error) {

      console.warn(
        "Crafting setup:",
        error
      );

    }


    try {

      if (
        SurvivalVR.systems.building &&
        typeof SurvivalVR.systems.building.setupBuilding === "function"
      ) {

        SurvivalVR.systems.building.setupBuilding();

      }

    } catch (error) {

      console.warn(
        "Building setup:",
        error
      );

    }


    try {

      if (
        SurvivalVR.systems.guide &&
        typeof SurvivalVR.systems.guide.setupGuide === "function"
      ) {

        SurvivalVR.systems.guide.setupGuide();

      }

    } catch (error) {

      console.warn(
        "Guide setup:",
        error
      );

    }


    try {

      if (
        SurvivalVR.systems.home &&
        typeof SurvivalVR.systems.home.setupHome === "function"
      ) {

        SurvivalVR.systems.home.setupHome();

      }

    } catch (error) {

      console.warn(
        "Home setup:",
        error
      );

    }


    try {

      if (
        SurvivalVR.systems.settings &&
        typeof SurvivalVR.systems.settings.setupSettings === "function"
      ) {

        SurvivalVR.systems.settings.setupSettings();

      }

    } catch (error) {

      console.warn(
        "Settings setup:",
        error
      );

    }


    // ============================================================
    // XR SESSION EVENTS
    // ============================================================

    renderer.xr.addEventListener(
      "sessionstart",
      () => {

        console.log(
          "WEBXR SESSION STARTED"
        );

        SurvivalVR.isXR = true;

        /*
         * Tell game.js that we are actually in VR.
         */

        if (
          typeof SurvivalVR.setVRState === "function"
        ) {

          SurvivalVR.setVRState(true);

        }

        /*
         * IMPORTANT:
         *
         * We DO NOT move the camera here.
         *
         * The Quest controls the XR camera.
         */

        document.body.classList.add("vr-mode");

        if (SurvivalVR.ui.hud) {
          SurvivalVR.ui.hud.classList.add("vr-active");
        }

      }
    );


    renderer.xr.addEventListener(
      "sessionend",
      () => {

        console.log(
          "WEBXR SESSION ENDED"
        );

        SurvivalVR.isXR = false;

        if (
          typeof SurvivalVR.setVRState === "function"
        ) {

          SurvivalVR.setVRState(false);

        }

        document.body.classList.remove("vr-mode");

        if (SurvivalVR.ui.hud) {
          SurvivalVR.ui.hud.classList.remove("vr-active");
        }

      }
    );


    // ============================================================
    // WINDOW RESIZE
    // ============================================================

    window.addEventListener(
      "resize",
      () => {

        /*
         * Don't fight WebXR's framebuffer sizing.
         *
         * This resize is mainly for normal browser mode.
         */

        if (!renderer.xr.isPresenting) {

          camera.aspect =
            window.innerWidth /
            window.innerHeight;

          camera.updateProjectionMatrix();

          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );

        }

      }
    );


    // ============================================================
    // START GAME
    // ============================================================

    async function startGame() {

      if (SurvivalVR.started) {
        return;
      }

      SurvivalVR.started = true;

      showLoading(
        "Creating your island...",
        10
      );


      /*
       * Hide the start menu.
       */

      if (SurvivalVR.ui.startScreen) {
        SurvivalVR.ui.startScreen.style.display = "none";
      }


      /*
       * Reset the rig before generating the island.
       *
       * Notice:
       *
       * We reset the RIG.
       *
       * We do NOT reset the XR camera's local tracking.
       */

      playerRig.position.set(
        0,
        0,
        0
      );

      playerRig.rotation.set(
        0,
        0,
        0
      );


      // ========================================================
      // GENERATE WORLD
      // ========================================================

      try {

        showLoading(
          "Generating terrain...",
          25
        );

        if (
          SurvivalVR.systems.world &&
          typeof SurvivalVR.systems.world.generateWorld === "function"
        ) {

          const existingSeed =
            SurvivalVR.GAME?.world?.seed || "";

          await SurvivalVR.systems.world.generateWorld(
            existingSeed || undefined,
            {
              preservePlayer: true
            }
          );

        }

      } catch (error) {

        console.error(
          "WORLD GENERATION ERROR:",
          error
        );

        showMessage(
          "World generation failed.",
          7000
        );

      }


      // ========================================================
      // START ENVIRONMENT
      // ========================================================

      try {

        if (
          SurvivalVR.systems.environment &&
          typeof SurvivalVR.systems.environment.start === "function"
        ) {

          SurvivalVR.systems.environment.start();

        }

      } catch (error) {

        console.warn(
          "Environment start:",
          error
        );

      }


      // ========================================================
      // START AUDIO
      // ========================================================

      try {

        if (
          SurvivalVR.systems.audio &&
          typeof SurvivalVR.systems.audio.start === "function"
        ) {

          SurvivalVR.systems.audio.start();

        }

      } catch (error) {

        console.warn(
          "Audio start:",
          error
        );

      }


      // ========================================================
      // START ANIMALS
      // ========================================================

      try {

        if (
          SurvivalVR.systems.animals &&
          typeof SurvivalVR.systems.animals.start === "function"
        ) {

          SurvivalVR.systems.animals.start();

        }

      } catch (error) {

        console.warn(
          "Animals start:",
          error
        );

      }


      // ========================================================
      // GAME STATE
      // ========================================================

      if (SurvivalVR.GAME) {

        SurvivalVR.GAME.state.started = true;
        SurvivalVR.GAME.state.paused = false;
        SurvivalVR.GAME.state.gameOver = false;

      }


      // ========================================================
      // SHOW HUD
      // ========================================================

      if (SurvivalVR.ui.hud) {
        SurvivalVR.ui.hud.style.display = "block";
      }


      hideLoading();

      showMessage(
        "Survive the island.",
        3500
      );

    }


    // ============================================================
    // START BUTTON
    // ============================================================

    if (SurvivalVR.ui.startGame) {

      SurvivalVR.ui.startGame.addEventListener(
        "click",
        async () => {

          await startGame();

        }
      );

    }


    // ============================================================
    // CONTINUE BUTTON
    // ============================================================

    if (SurvivalVR.ui.continueGame) {

      SurvivalVR.ui.continueGame.addEventListener(
        "click",
        async () => {

          /*
           * Start the world first.
           */

          await startGame();


          /*
           * Then attempt to load the saved game.
           */

          try {

            const saveSystem =
              SurvivalVR.systems.save;

            if (
              saveSystem &&
              typeof saveSystem.loadGame === "function"
            ) {

              await saveSystem.loadGame();

              showMessage(
                "Saved world loaded.",
                3000
              );

            }

          } catch (error) {

            console.warn(
              "Could not load save:",
              error
            );

          }

        }
      );

    }


    // ============================================================
    // PAUSE
    // ============================================================

    function pauseGame() {

      if (!SurvivalVR.GAME) {
        return;
      }

      SurvivalVR.GAME.state.paused = true;

      if (
        typeof SurvivalVR.setPaused === "function"
      ) {

        SurvivalVR.setPaused(true);

      }

      if (SurvivalVR.ui.pause) {
        SurvivalVR.ui.pause.style.display = "flex";
      }

    }


    function resumeGame() {

      if (!SurvivalVR.GAME) {
        return;
      }

      SurvivalVR.GAME.state.paused = false;

      if (
        typeof SurvivalVR.setPaused === "function"
      ) {

        SurvivalVR.setPaused(false);

      }

      if (SurvivalVR.ui.pause) {
        SurvivalVR.ui.pause.style.display = "none";
      }

    }


    if (SurvivalVR.ui.pauseResume) {

      SurvivalVR.ui.pauseResume.addEventListener(
        "click",
        resumeGame
      );

    }


    if (SurvivalVR.ui.pauseHome) {

      SurvivalVR.ui.pauseHome.addEventListener(
        "click",
        () => {

          resumeGame();

          if (SurvivalVR.ui.startScreen) {
            SurvivalVR.ui.startScreen.style.display = "flex";
          }

        }
      );

    }


    // ============================================================
    // KEYBOARD PAUSE
    // ============================================================

    window.addEventListener(
      "keydown",
      (event) => {

        if (event.code === "Escape") {

          if (
            SurvivalVR.GAME &&
            SurvivalVR.GAME.state.paused
          ) {

            resumeGame();

          } else {

            pauseGame();

          }

        }

      }
    );


    // ============================================================
    // UPDATE HUD
    // ============================================================

    function updateHUD() {

      const p =
        SurvivalVR.player;

      if (!p) {
        return;
      }


      const health =
        document.getElementById("health-value");

      const hunger =
        document.getElementById("hunger-value");

      const thirst =
        document.getElementById("thirst-value");

      const stamina =
        document.getElementById("stamina-value");


      if (health) {
        health.textContent =
          Math.round(p.health);
      }

      if (hunger) {
        hunger.textContent =
          Math.round(p.hunger);
      }

      if (thirst) {
        thirst.textContent =
          Math.round(p.thirst);
      }

      if (stamina) {
        stamina.textContent =
          Math.round(p.stamina);
      }

    }


    // ============================================================
    // XR-SAFE GAME LOOP
    // ============================================================

    function gameLoop(time, xrFrame) {

      /*
       * THIS IS VERY IMPORTANT.
       *
       * WebXR uses renderer.setAnimationLoop().
       *
       * We do NOT use:
       *
       * requestAnimationFrame()
       *
       * for the actual game loop.
       */


      let delta =
        SurvivalVR.clock.getDelta();


      /*
       * Prevent giant jumps if the browser pauses briefly.
       */

      delta =
        Math.min(delta, 0.05);


      SurvivalVR.lastFrameTime =
        time;


      // ========================================================
      // GAME SURVIVAL
      // ========================================================

      if (
        SurvivalVR.started &&
        SurvivalVR.GAME &&
        SurvivalVR.GAME.state.started &&
        !SurvivalVR.GAME.state.paused
      ) {

        try {

          if (
            typeof SurvivalVR.updateSurvival ===
            "function"
          ) {

            SurvivalVR.updateSurvival(delta);

          }

        } catch (error) {

          console.warn(
            "Survival update:",
            error
          );

        }

      }


      // ========================================================
      // HANDS / CONTROLLERS
      // ========================================================

      if (
        SurvivalVR.systems.hands &&
        typeof SurvivalVR.systems.hands.updateHands ===
        "function"
      ) {

        try {

          /*
           * IMPORTANT:
           *
           * We allow hands.js to update the controllers.
           *
           * It must NOT overwrite camera tracking.
           */

          SurvivalVR.systems.hands.updateHands(
            delta,
            xrFrame
          );

        } catch (error) {

          console.warn(
            "Hands update:",
            error
          );

        }

      } else if (
        SurvivalVR.systems.hands &&
        typeof SurvivalVR.systems.hands.update ===
        "function"
      ) {

        try {

          SurvivalVR.systems.hands.update(
            delta,
            xrFrame
          );

        } catch (error) {

          console.warn(
            "Hands update:",
            error
          );

        }

      }


      // ========================================================
      // WORLD
      // ========================================================

      if (
        SurvivalVR.systems.world &&
        typeof SurvivalVR.systems.world.update ===
        "function"
      ) {

        try {

          SurvivalVR.systems.world.update(
            delta
          );

        } catch (error) {

          console.warn(
            "World update:",
            error
          );

        }

      }


      // ========================================================
      // ENVIRONMENT
      // ========================================================

      if (
        SurvivalVR.systems.environment &&
        typeof SurvivalVR.systems.environment.update ===
        "function"
      ) {

        try {

          SurvivalVR.systems.environment.update(
            delta
          );

        } catch (error) {

          console.warn(
            "Environment update:",
            error
          );

        }

      }


      // ========================================================
      // ANIMALS
      // ========================================================

      if (
        SurvivalVR.systems.animals &&
        typeof SurvivalVR.systems.animals.update ===
        "function"
      ) {

        try {

          SurvivalVR.systems.animals.update(
            delta
          );

        } catch (error) {

          console.warn(
            "Animals update:",
            error
          );

        }

      }


      // ========================================================
      // BUILDING
      // ========================================================

      if (
        SurvivalVR.systems.building &&
        typeof SurvivalVR.systems.building.update ===
        "function"
      ) {

        try {

          SurvivalVR.systems.building.update(
            delta
          );

        } catch (error) {

          console.warn(
            "Building update:",
            error
          );

        }

      }


      // ========================================================
      // HUD
      // ========================================================

      if (SurvivalVR.started) {

        updateHUD();

      }


      // ========================================================
      // RENDER
      // ========================================================

      /*
       * Do not manually modify camera position here.
       *
       * Three.js WebXRManager updates the XR camera from
       * the Quest tracking system.
       */

      renderer.render(
        scene,
        camera
      );

    }


    // ============================================================
    // START THE XR-SAFE LOOP
    // ============================================================

    renderer.setAnimationLoop(
      gameLoop
    );


    // ============================================================
    // READY
    // ============================================================

    hideLoading();

    console.log(
      "===================================="
    );

    console.log(
      "ISLAND SURVIVAL VR READY"
    );

    console.log(
      "WebXR:",
      renderer.xr.enabled
    );

    console.log(
      "Reference space:",
      renderer.xr.getReferenceSpaceType()
    );

    console.log(
      "Player rig:",
      playerRig
    );

    console.log(
      "Camera:",
      camera
    );

    console.log(
      "===================================="

    );

  </script>
